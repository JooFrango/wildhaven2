name: Sirocauro v03 - GIF real do GLB animado
on:
  push:
    branches:
      - feat/sirocauro-reparo-malha-skin-v03
    paths:
      - '.github/workflows/sirocauro-v03-gif.yml'
      - 'assets/models/creatures/sirocauro/v03/tools/**'
      - 'assets/models/creatures/sirocauro/v03/sirocauro-v03-rig41-malha-corrigida.glb'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  renderizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright three
          npx playwright install --with-deps chromium
          python3 -m pip install pillow
      - name: Capturar quatro animacoes do GLB
        run: node assets/models/creatures/sirocauro/v03/tools/render-gif.mjs
      - name: Publicar GIF no repositorio
        run: |
          rm -rf assets/models/creatures/sirocauro/v03/previews/frames-temp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures/sirocauro/v03/previews/sirocauro-v03-4-animacoes-reais.gif assets/models/creatures/sirocauro/v03/previews/sirocauro-v03-preview-quadros-reais.png
          git commit -m "preview(sirocauro): GIF de animacoes renderizado do GLB real"
          git push origin HEAD:feat/sirocauro-reparo-malha-skin-v03
      - name: Enviar copia do GIF
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sirocauro-v03-gif-real
          path: assets/models/creatures/sirocauro/v03/previews/sirocauro-v03-4-animacoes-reais.gif
          if-no-files-found: ignore
