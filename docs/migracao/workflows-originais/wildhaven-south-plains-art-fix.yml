name: Wildhaven — corrigir GLB sul de acordo com arte (20 hexagonos)
on:
  push:
    branches: [wildhaven-south-plains-corrected-concept-v02]
    paths:
      - 'world/south-plains-art-fix/**'
      - '.github/workflows/wildhaven-south-plains-art-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-south-plains-art-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  corrected-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias para modelos 3D e render reais
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Gerar dois GLBs na grade geograficamente corrigida
        run: |
          python world/south-plains-art-fix/tools/build_corrected_plains.py \
            --repo-root . --output-dir world/south-plains-art-fix
      - name: Verificar posições, bordas dos GLBs, geometria, campos abertos
        run: |
          python world/south-plains-art-fix/tests/validate_corrected_20.py \
            --repo-root . --output-dir world/south-plains-art-fix
      - name: Renderizar prévias reais do mundo conectado
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/south-plains-art-fix/tools/render_corrected_real.py \
            --repo-root . --output-dir world/south-plains-art-fix
      - name: Preparar viewer independente sem tocar no jogo
        run: python world/south-plains-art-fix/tools/build_corrected_viewer.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar viewer com os 20 GLBs e a grade corrigida
        working-directory: world/south-plains-art-fix/viewer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Disponibilizar pacote para validação artística
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-South-Plains-ArtFix-v02-20GLBs
          retention-days: 30
          path: |
            world/south-plains-art-fix/models/*.glb
            world/south-plains-art-fix/manifest.json
            world/south-plains-art-fix/model_report.json
            world/south-plains-art-fix/preview/*.png
            world/south-plains-art-fix/viewer/dist/
      - name: Publicar apenas na branch depois dos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/south-plains-art-fix/models \
            world/south-plains-art-fix/manifest.json \
            world/south-plains-art-fix/model_report.json \
            world/south-plains-art-fix/preview \
            world/south-plains-art-fix/viewer/index.html \
            world/south-plains-art-fix/viewer/main.js \
            world/south-plains-art-fix/viewer/package.json \
            world/south-plains-art-fix/viewer/copy-assets.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): correct two south meadows with sparse forest and exact GLB seams [skip ci]'
            git push origin HEAD:wildhaven-south-plains-corrected-concept-v02
          fi
