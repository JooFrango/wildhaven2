name: Wildhaven - Varrisco v02 animated GLB and real renders
on:
  push:
    branches:
      - wildhaven-varrisco-animated-v02
    paths:
      - .github/workflows/wildhaven-varrisco-v02.yml
      - assets/models/creatures/varrisco/v02/source/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-animated-glb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 3D, math and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1 libegl1
          python -m pip install --disable-pip-version-check --no-cache-dir 'numpy<3' scipy trimesh vtk pillow
      - name: Generate real 3D weighted-skin GLB and 17 animation clips
        run: python assets/models/creatures/varrisco/v02/source/build_animated.py
      - name: Independently reimport GLB and generate GIF and 3 genuine renders
        run: xvfb-run -a python assets/models/creatures/varrisco/v02/source/validate_and_preview.py
      - name: Check binary, manifests and screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, struct
          root = Path('assets/models/creatures/varrisco/v02')
          m = json.loads((root/'manifest.json').read_text())
          glb = root / m['glb']['path']
          data = glb.read_bytes()
          assert data[:4] == b'glTF' and struct.unpack_from('<I', data, 4)[0] == 2
          assert struct.unpack_from('<I', data, 8)[0] == len(data)
          assert len(data) == m['glb']['bytes']
          assert hashlib.sha256(data).hexdigest() == m['glb']['sha256']
          jlen = struct.unpack_from('<I', data, 12)[0]
          j = json.loads(data[20:20+jlen])
          assert len(j.get('skins',[])) == 1 and len(j.get('animations',[])) == 17
          assert len(j['skins'][0]['joints']) == 22
          assert len(m['previews']) >= 9
          for info in m['previews']:
              path = root/info['path']
              b = path.read_bytes()
              assert len(b)==info['bytes'] and hashlib.sha256(b).hexdigest()==info['sha256'], path
          assert (root/'previews/varrisco-v02-walk-run-animated-real-glb.gif').stat().st_size > 100000
          print('Verified published candidates:',len(data),'GLB bytes, 22 joints, 17 clips,',len(m['previews']),'real previews')
          PY
      - name: Preserve original v01 and publish all real binary assets
        run: |
          set -euo pipefail
          ROOT=assets/models/creatures/varrisco
          mkdir -p "$ROOT/v01/source"
          cp "$ROOT/v02/source/blockout_source.py" "$ROOT/v01/source/build.py"
          cp "$ROOT/v02/varrisco-v01-anatomy-blockout.glb" "$ROOT/v01/varrisco-v01-anatomy-blockout.glb"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          f=Path('assets/models/creatures/varrisco/v01/varrisco-v01-anatomy-blockout.glb')
          b=f.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          info={'species':'varrisco','version':'v01','stage':'static_anatomy','glb':f.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'source':'source/build.py','animations':[],'rig':None,'integration':False,'previous_version_preserved':True}
          f.parent.joinpath('manifest.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/v01" "$ROOT/v02"
          if ! git diff --cached --quiet; then
            git commit -m "assets(varrisco): publish validated v02 rig GLB and genuine animated previews [skip ci]"
            git push origin HEAD:wildhaven-varrisco-animated-v02
          fi
