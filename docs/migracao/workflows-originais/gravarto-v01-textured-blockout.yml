name: Wildhaven | Gravarto v01 | Textured anatomical GLB and verified renders
on:
  push:
    branches:
      - wildhaven-gravarto-textured-blockout-v01
    paths:
      - 'assets/models/creatures/gravarto/v01/bootstrap/**'
      - '.github/workflows/gravarto-v01-textured-blockout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-textured-blockout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GLB modeling and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libxrender1 libsm6
          python -m pip install --no-cache-dir numpy==2.3.5 trimesh==4.11.1 pillow==12.3.0 vtk==9.6.2
      - name: Extract versioned procedural source
        run: |
          set -euo pipefail
          DEST="assets/models/creatures/gravarto/v01"
          base64 -d "$DEST/bootstrap/gravarto-source.tar.xz.b64" > /tmp/gravarto-v01-source.tar.xz
          tar -xJf /tmp/gravarto-v01-source.tar.xz -C "$DEST"
          test -s "$DEST/source/build.py"
          test -s "$DEST/source/render.py"
          test -s "$DEST/source/validate.py"
      - name: Build real UV textured GLB and paint albedo atlas
        run: |
          python assets/models/creatures/gravarto/v01/source/build.py
          python assets/models/creatures/gravarto/v01/source/validate.py
      - name: Reimport final GLB and render three real evidence views
        run: |
          xvfb-run -a python assets/models/creatures/gravarto/v01/source/render.py
          python assets/models/creatures/gravarto/v01/source/validate.py
      - name: Confirm GLB checksum / actual textures / preview bytes
        run: |
          python - <<'PY'
          import hashlib,json, pathlib
          root=pathlib.Path('assets/models/creatures/gravarto/v01')
          obj=json.loads((root/'manifest.json').read_text())
          asset=root/'gravarto-v01-anatomy-blockout.glb'
          data=asset.read_bytes()
          assert obj['glb']['bytes']==len(data)
          assert obj['glb']['sha256']==hashlib.sha256(data).hexdigest()
          assert obj['rendered_glb_sha256']==obj['glb']['sha256']
          assert obj['paint']['markings_via_extra_polygons'] is False
          for name in ('profile','front','three-quarter'):
              p=root/f'previews/gravarto-v01-real-glb-{name}.png'
              assert p.exists() and p.stat().st_size>100000
              assert p.name in obj['previews']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==obj['previews'][p.name]['sha256']
          obj['publication']='branch_only_pending_user_artistic_review'
          obj['concept_reference']='approved concept in conversation 2026-11-09; concept image not republished in this branch'
          (root/'manifest.json').write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')
          print('BINARY CHECK',asset,len(data),'sha256',obj['glb']['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gravarto-v01-real-textured-glb-and-renders
          path: |
            assets/models/creatures/gravarto/v01/gravarto-v01-anatomy-blockout.glb
            assets/models/creatures/gravarto/v01/manifest.json
            assets/models/creatures/gravarto/v01/texture/*.png
            assets/models/creatures/gravarto/v01/previews/*.png
          if-no-files-found: error
      - name: Publish real binary GLB, source, texture and GLB-reimported renders to branch
        run: |
          set -euo pipefail
          root="assets/models/creatures/gravarto/v01"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$root/source/" "$root/README.md" "$root/gravarto-v01-anatomy-blockout.glb" "$root/manifest.json" "$root/texture/" "$root/previews/"
          if ! git diff --cached --quiet; then
            git commit -m "assets(gravarto): publish actual static UV-textured GLB and three imported renders [skip ci]"
            git push origin HEAD:wildhaven-gravarto-textured-blockout-v01
          fi
          git fetch origin +refs/heads/wildhaven-gravarto-textured-blockout-v01:refs/remotes/origin/wildhaven-gravarto-textured-blockout-v01
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/wildhaven-gravarto-textured-blockout-v01)"
          echo "Branch commit verified on remote: $(git rev-parse HEAD)"
