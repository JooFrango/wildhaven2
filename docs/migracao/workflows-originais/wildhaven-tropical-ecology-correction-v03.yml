name: 'Wildhaven - correcao ecologica real da escarpa v03'
on:
  push:
    branches: [wildhaven-tropical-ecology-correction-v03]
    paths:
      - 'world/tropical-ecology-v03/**'
      - '.github/workflows/wildhaven-tropical-ecology-correction-v03.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-tropical-ecology-correction-v03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas 3D
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Gerar 9 GLBs com mascara ecologica real
        run: |
          python world/tropical-ecology-v03/tools/build_ecology_v03.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-ecology-v03
      - name: Validar copas, rochas, raizes, biomas e 137 costuras
        run: |
          python world/tropical-ecology-v03/tests/validate_ecology_v03.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-ecology-v03
      - name: Renderizar GLBs reais
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/tropical-ecology-v03/tools/render_ecology_v03.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-ecology-v03
      - name: Salvar pacote tecnico
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-58-Hex-Ecology-Correction-v03
          retention-days: 30
          path: |
            world/tropical-ecology-v03/models/*.glb
            world/tropical-ecology-v03/manifest.json
            world/tropical-ecology-v03/model_report.json
            world/tropical-ecology-v03/audit/*.gz
            world/tropical-ecology-v03/preview/*.png
      - name: Publicar na branch isolada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/tropical-ecology-v03/models \
            world/tropical-ecology-v03/manifest.json \
            world/tropical-ecology-v03/model_report.json \
            world/tropical-ecology-v03/audit \
            world/tropical-ecology-v03/preview
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): biome-safe trees and rock escarpment v03 [skip ci]'
            git push origin HEAD:wildhaven-tropical-ecology-correction-v03
          fi
