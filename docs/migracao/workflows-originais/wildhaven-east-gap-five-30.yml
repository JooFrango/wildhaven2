name: 'Wildhaven — 5 planicies 5km no vazio leste: 30 GLBs reais'
on:
  push:
    branches: [wildhaven-east-gap-five-plains-30hex-v01]
    paths:
      - 'world/plains-east-gap-30/**'
      - '.github/workflows/wildhaven-east-gap-five-30.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-east-gap-five-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-five-25:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas de geometria, GLB e VTK
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Exportar cinco GLBs 5km reais conectados a partir dos vizinhos
        run: |
          python world/plains-east-gap-30/tools/build_eastern_five.py \
            --repo-root . --output-dir world/plains-east-gap-30
      - name: Validar cinco GLBs contra as dez bordas, altitude, cores, inclinação, limites
        run: |
          python world/plains-east-gap-30/tests/validate_30_real_glbs.py \
            --repo-root . --output-dir world/plains-east-gap-30
      - name: Renderizar mundo 25 hexágonos, cinco novas planícies e vistas individuais
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/plains-east-gap-30/tools/render_30_real.py \
            --repo-root . --output-dir world/plains-east-gap-30
      - name: Preparar visualizador Three.js sem modificar Alpha01
        run: python world/plains-east-gap-30/tools/build_viewer_30.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar visualizador independente de 25 GLBs
        working-directory: world/plains-east-gap-30/viewer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Arquivo de download completo para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-30-GLBs-Five-New-Eastern-Plain-Tiles
          retention-days: 30
          path: |
            world/plains-east-gap-30/models/*.glb
            world/plains-east-gap-30/manifest.json
            world/plains-east-gap-30/model_report.json
            world/plains-east-gap-30/preview/*.png
            world/plains-east-gap-30/viewer/dist/
      - name: Publicar novos GLBs e renders reais somente na branch de aprovação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/plains-east-gap-30/models \
            world/plains-east-gap-30/manifest.json \
            world/plains-east-gap-30/model_report.json \
            world/plains-east-gap-30/preview \
            world/plains-east-gap-30/viewer/index.html \
            world/plains-east-gap-30/viewer/main.js \
            world/plains-east-gap-30/viewer/package.json \
            world/plains-east-gap-30/viewer/copy-assets.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): 25 real GLBs: five all-prairie blue tiles, two unchanged forest/plain transitions [skip ci]'
            git push origin HEAD:wildhaven-east-gap-five-plains-30hex-v01
          fi
