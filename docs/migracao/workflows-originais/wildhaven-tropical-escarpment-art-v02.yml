name: 'Wildhaven — escarpa rochosa tropical real, 58 hex v02'
on:
  push:
    branches: [wildhaven-tropical-escarpment-art-v02]
    paths:
      - 'world/tropical-escarpment-v02/**'
      - '.github/workflows/wildhaven-tropical-escarpment-art-v02.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-tropical-escarpment-art-v02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-escarpment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas de geometria e render
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Gerar nove GLBs reais com escarpa geológica
        run: |
          python world/tropical-escarpment-v02/tools/build_escarpment_v02.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-escarpment-v02
      - name: Verificar 58 hex, 137 costuras, subida e paredão rochoso
        run: |
          python world/tropical-escarpment-v02/tests/validate_escarpment_v02.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-escarpment-v02
      - name: Renderizar prévias reais inclusive ângulos baixos
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/tropical-escarpment-v02/tools/render_escarpment_v02.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-escarpment-v02
      - name: Disponibilizar pacote de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-Escarpa-Tropical-Real-v02-58-Hex
          retention-days: 30
          path: |
            world/tropical-escarpment-v02/models/*.glb
            world/tropical-escarpment-v02/manifest.json
            world/tropical-escarpment-v02/model_report.json
            world/tropical-escarpment-v02/preview/*.png
      - name: Publicar apenas na branch de aprovação visual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/tropical-escarpment-v02/models \
            world/tropical-escarpment-v02/manifest.json \
            world/tropical-escarpment-v02/model_report.json \
            world/tropical-escarpment-v02/preview
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): true 80m seam-safe tropical rock escarpment [skip ci]'
            git push origin HEAD:wildhaven-tropical-escarpment-art-v02
          fi
