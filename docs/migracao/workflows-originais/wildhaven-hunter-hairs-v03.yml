name: Wildhaven - Hunter Workshop novos cabelos v03
on:
  push:
    branches: [wildhaven-hunter-hairs-v03]
    paths:
      - 'assets/hunters/hunter-workshop/hair/source/generate_hairs_v03.py'
      - 'assets/hunters/hunter-workshop/hair/source/verify_hairs_v03.py'
      - '.github/workflows/wildhaven-hunter-hairs-v03.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-hunter-hairs-v03-branch
  cancel-in-progress: true
jobs:
  build-hair-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh dependencies pinned for repeatability
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'trimesh==4.11.1' 'Pillow==12.3.0'
      - name: Export real GLB hairstyles
        run: python assets/hunters/hunter-workshop/hair/source/generate_hairs_v03.py
      - name: Validate geometry, glTF, SHA, UV and rig
        run: python assets/hunters/hunter-workshop/hair/source/verify_hairs_v03.py
      - uses: actions/upload-artifact@v4
        with:
          name: wildhaven-hunter-new-hair-v03-glbs
          path: |
            assets/hunters/hunter-workshop/hair/swept-back-v01/*.glb
            assets/hunters/hunter-workshop/hair/swept-back-v01/*.png
            assets/hunters/hunter-workshop/hair/swept-back-v01/manifest.json
            assets/hunters/hunter-workshop/hair/short-ponytail-v01/*.glb
            assets/hunters/hunter-workshop/hair/short-ponytail-v01/*.png
            assets/hunters/hunter-workshop/hair/short-ponytail-v01/manifest.json
            assets/hunters/hunter-workshop/catalog/hair-v03.json
          retention-days: 30
      - name: Commit real GLB binaries to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hunters/hunter-workshop/hair/swept-back-v01/ assets/hunters/hunter-workshop/hair/short-ponytail-v01/ assets/hunters/hunter-workshop/catalog/hair-v03.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(hunters): publish two new real hair GLBs [skip ci]'
            git fetch origin wildhaven-hunter-hairs-v03
            git rebase origin/wildhaven-hunter-hairs-v03
            git push origin HEAD:wildhaven-hunter-hairs-v03
          fi
