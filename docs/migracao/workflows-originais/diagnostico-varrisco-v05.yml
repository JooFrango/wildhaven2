name: Varrisco v05 — diagnóstico tático 60s
on:
  push:
    branches:
      - feat/varrisco-v05-ia-combate-completa
    paths:
      - labs/ia-criaturas/scripts/diagnosticar-combate-v05.mjs
      - .github/workflows/diagnostico-varrisco-v05.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Traço real das decisões
        working-directory: labs/ia-criaturas
        run: node scripts/diagnosticar-combate-v05.mjs
