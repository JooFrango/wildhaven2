name: Wildhaven - Hunter Workshop cabelos reais v02
on:
  push:
    branches: [wildhaven-hunter-hairs-v02]
    paths:
      - 'assets/hunters/hunter-workshop/hair/source/generate_hairs_v02.py'
      - '.github/workflows/wildhaven-hunter-hairs-v02.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-hunter-hairs-v02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-hair-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install low poly GLB dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4.5,<5' 'Pillow>=10,<13'
      - name: Generate both GLB meshes and UV atlases
        run: python assets/hunters/hunter-workshop/hair/source/generate_hairs_v02.py
      - name: Validate genuine binary glTF assets
        run: python assets/hunters/hunter-workshop/hair/source/verify_hairs_v02.py
      - uses: actions/upload-artifact@v4
        with:
          name: wildhaven-hunter-hair-v02-glb
          path: |
            assets/hunters/hunter-workshop/hair/short-v02/*.glb
            assets/hunters/hunter-workshop/hair/mohawk-v02/*.glb
            assets/hunters/hunter-workshop/hair/*-v02/*.png
            assets/hunters/hunter-workshop/hair/*-v02/manifest.json
          retention-days: 30
      - name: Publish original exported GLBs in this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hunters/hunter-workshop/hair/short-v02/ assets/hunters/hunter-workshop/hair/mohawk-v02/ assets/hunters/hunter-workshop/catalog/hair-v02.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(hunters): publish two real hair GLB assets [skip ci]'
            git push origin HEAD:wildhaven-hunter-hairs-v02
          fi
