name: Snow fauna v02 - three real GLBs with 3-view renders
on:
  push:
    branches:
      - feat/fauna-neve-revisao-v02-tres-modelos
    paths:
      - '.github/workflows/fauna-neve-v02-3-glbs.yml'
      - 'assets/models/creatures/snow-fauna-v02/source/source-v02.tar.xz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and headless VTK packages
        run: |
          python -m pip install numpy==2.3.5 Pillow==12.3.0 trimesh==4.11.1 vtk==9.6.2
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libosmesa6 libgl1-mesa-dri xvfb
      - name: Extract deterministic real GLB generators
        run: |
          cd assets/models/creatures/snow-fauna-v02
          base64 -d source/source-v02.tar.xz.b64 | tar -xJ
          test -s source/build_snow_fauna.py
          test -s source/render_snow_fauna.py
      - name: Generate and independently reimport all three textured GLBs
        run: |
          python assets/models/creatures/snow-fauna-v02/source/build_snow_fauna.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,trimesh
          root=Path('assets/models/creatures/snow-fauna-v02')
          data=json.loads((root/'manifest.json').read_text())
          expected={
           'casquim':('8c98f47f53ae40136d0529761a3eb8dc551074b684a243527cb06b1a6643e082',2966,1582524),
           'tufrino':('57a9205794b4af75c6f4f6454c11aa60d6bacafcd307d7656f6a7e43aa3166c8',2014,1513172),
           'nevisco':('9afb14db5f1ceb7b0f0517e7e3b9d3094838fa4121f64d7fc3a2d275457f9f5e',2164,1610248)
          }
          assert set(x['id'] for x in data)==set(expected)
          for d in data:
             name=d['id'];sha,tris,bytes_size=expected[name]
             p=root/'assets'/name/d['file']
             raw=p.read_bytes()
             assert len(raw)==bytes_size and raw[:4]==b'glTF'
             assert hashlib.sha256(raw).hexdigest()==sha==d['sha256']
             scene=trimesh.load(p,force='scene',process=False)
             assert len(scene.geometry)==1
             assert sum(len(m.faces) for m in scene.geometry.values())==tris<=3000
             assert all(getattr(m.visual,'uv',None) is not None for m in scene.geometry.values())
             assert all(getattr(m.visual.material,'baseColorTexture',None) is not None for m in scene.geometry.values())
             print(f'{name}: {tris} triangles; bytes {bytes_size}; sha256 {sha}')
          PY
      - name: Render profile front and three-quarter directly from GLB with VTK
        run: |
          xvfb-run -a python assets/models/creatures/snow-fauna-v02/source/render_snow_fauna.py
      - name: Publish immutable v02 GLBs, UV maps and actual render evidence
        run: |
          set -euo pipefail
          BASE=assets/models/creatures/snow-fauna-v02
          for ID in casquim tufrino nevisco; do
            DEST=assets/models/creatures/$ID/v02
            mkdir -p "$DEST/previews"
            cp "$BASE/assets/$ID/"* "$DEST/"
            cp "$BASE/previews/${ID}_"*.png "$DEST/previews/"
            test -s "$DEST/${ID}_blockout_v02.glb"
            test -s "$DEST/previews/${ID}_perfil_real_glb.png"
            test -s "$DEST/previews/${ID}_frente_real_glb.png"
            test -s "$DEST/previews/${ID}_tres_quartos_real_glb.png"
          done
          cp "$BASE/previews/render_report.json" "$BASE/render_report.json"
          rm -rf "$BASE/assets" "$BASE/previews"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASE/source/" "$BASE/manifest.json" "$BASE/render_report.json" "$BASE/README.md"
          git add assets/models/creatures/{casquim,tufrino,nevisco}/v02/
          git commit -m "feat(snow-fauna): three real 3k-max textured v02 GLBs and 9 real renders"
          git push origin HEAD:feat/fauna-neve-revisao-v02-tres-modelos
