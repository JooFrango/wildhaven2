name: Wildhaven - Confirm 9 GLBs and Render Connected 58 Hex v01

on:
  push:
    branches:
      - wildhaven-selva-primordial-ruinas-9hex-v01
    paths:
      - .github/workflows/wildhaven-selva-primordial-connected-v01.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wildhaven-selva-primordial-full-map-v01
  cancel-in-progress: false

jobs:
  verify-remote-and-render-world:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up render packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" "scipy>=1.11" "trimesh>=4.7" "pillow>=10" "vtk>=9.3"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1

      - name: Independently verify newly published GitHub GLBs and full composition
        run: python world/tropical-skull-ruins-v01/tests/verify_remote_v01.py

      - name: Render 58 connected real GLBs and jungle seam
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VTK_DEFAULT_OPENGL_WINDOW: vtkXOpenGLRenderWindow
        run: |
          xvfb-run -a python world/tropical-skull-ruins-v01/tools/render_world_v01.py --repo-root .

      - name: Publish remote binary audit and full world real previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world/tropical-skull-ruins-v01/audit/remote_binary_verification.json
          git add world/tropical-skull-ruins-v01/preview
          git diff --cached --stat
          git commit -m "render(world): verify 9 published GLBs and preview 58 connected tiles [skip ci]"
          git push origin HEAD:wildhaven-selva-primordial-ruinas-9hex-v01
