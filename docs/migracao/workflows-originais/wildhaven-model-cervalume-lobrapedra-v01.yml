name: Wildhaven - Model Cervalume + Lobrapedra
on:
  push:
    branches: [wildhaven-fauna-cervalume-lobrapedra-modeling-v01]
    paths:
      - 'assets/models/creatures/fauna-optimization-v11/source/**'
      - '.github/workflows/wildhaven-model-cervalume-lobrapedra-v01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 trimesh==4.11.1 vtk==9.6.2 pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 fonts-dejavu-core
      - name: Generate real source GLBs
        run: python3 assets/models/creatures/fauna-optimization-v11/source/generate_pair.py
      - name: Optimize, validate and render
        run: xvfb-run -a python3 assets/models/creatures/fauna-optimization-v11/source/build_pair.py
      - uses: actions/upload-artifact@v4
        with:
          name: wildhaven-cervalume-lobrapedra-real-models
          path: |
            assets/models/creatures/cervalume/*.glb
            assets/models/creatures/cervalume/*.json
            assets/models/creatures/cervalume/*real-3d-*.png
            assets/models/creatures/lobrapedra/*.glb
            assets/models/creatures/lobrapedra/*.json
            assets/models/creatures/lobrapedra/*real-3d-*.png
            assets/models/creatures/fauna-optimization-v11/previews/*.png
            docs/fauna-3d-inventory-v01.*
          if-no-files-found: error
      - name: Commit validated modeled assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/creatures/cervalume/ assets/models/creatures/lobrapedra/
          git add assets/models/creatures/fauna-optimization-v11/previews/ docs/fauna-3d-inventory-v01.*
          if ! git diff --cached --quiet; then
            git commit -m 'assets(fauna): model Cervalume + Lobrapedra with rigs, animations and LODs [skip ci]'
            git fetch origin wildhaven-fauna-cervalume-lobrapedra-modeling-v01
            git rebase origin/wildhaven-fauna-cervalume-lobrapedra-modeling-v01
            git push origin HEAD:wildhaven-fauna-cervalume-lobrapedra-modeling-v01
          fi
