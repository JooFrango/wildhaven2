name: Wildhaven - Global Fauna Audit + Arumbar v04 Optimization
on:
  push:
    branches: [wildhaven-fauna-global-optimization-arumbar-v04]
    paths:
      - 'assets/models/creatures/fauna-optimization-v01/source/pipeline.py.gz'
      - '.github/workflows/wildhaven-fauna-global-optimization-arumbar-v04.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-optimize-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned geometry and raster dependencies
        run: |
          python3 -m pip install --disable-pip-version-check             numpy==2.2.6 scipy==1.15.3 trimesh==4.11.1             vtk==9.6.2 pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1
      - name: Restore readable pipeline source and patch valid non-indexed glTF support
        run: |
          gzip -dc assets/models/creatures/fauna-optimization-v01/source/pipeline.py.gz             > assets/models/creatures/fauna-optimization-v01/source/pipeline.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("assets/models/creatures/fauna-optimization-v01/source/pipeline.py")
          s=p.read_text()
          old="v=read_accessor(d,b,p['attributes']['POSITION']).reshape(-1,3).astype(np.float32);v=transform_positions(v,M);f=read_accessor(d,b,p['indices']).reshape(-1,3)"
          new="v=read_accessor(d,b,p['attributes']['POSITION']).reshape(-1,3).astype(np.float32);v=transform_positions(v,M);f=(read_accessor(d,b,p['indices']).reshape(-1,3) if 'indices' in p else np.arange(len(v),dtype=np.uint32).reshape(-1,3))"
          if old not in s:
              raise SystemExit("expected renderer line not found")
          s=s.replace(old,new)
          side_old="if angle=='side':cam.SetPosition(center[0],center[1]+ext*.18,center[2]+ext*2.6)"
          front_old="elif angle=='front':cam.SetPosition(center[0]+ext*2.6,center[1]+ext*.18,center[2])"
          if side_old not in s or front_old not in s:
              raise SystemExit("expected camera lines not found")
          s=s.replace(side_old,"if angle=='side':cam.SetPosition(center[0]+ext*2.6,center[1]+ext*.18,center[2])")
          s=s.replace(front_old,"elif angle=='front':cam.SetPosition(center[0],center[1]+ext*.18,center[2]+ext*2.6)")
          p.write_text(s)
          PY
          python3 -m py_compile assets/models/creatures/fauna-optimization-v01/source/pipeline.py
      - name: Audit every published fauna GLB, build Arumbar LODs, render and validate
        run: |
          xvfb-run -a python3 assets/models/creatures/fauna-optimization-v01/source/pipeline.py all --root .
      - name: Upload exact generated deliverables
        uses: actions/upload-artifact@v4
        with:
          name: wildhaven-fauna-audit-arumbar-v04-real-assets
          path: |
            docs/fauna-3d-inventory-v01.json
            docs/fauna-3d-inventory-v01.md
            assets/models/creatures/fauna-optimization-v01/source/pipeline.py
            assets/models/creatures/arumbar/arumbar-savanna-optimized-v04-LOD*.glb
            assets/models/creatures/arumbar/arumbar-optimization-manifest-v04.json
            assets/models/creatures/arumbar/arumbar-structural-benchmark-v04.json
            assets/models/creatures/arumbar/arumbar-real-3d-*-optimized-v04.png
            assets/models/creatures/arumbar/arumbar-v03-v04-real-comparison.png
          if-no-files-found: error
      - name: Commit validated binaries, authentic renders, audit and readable source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fauna-3d-inventory-v01.json docs/fauna-3d-inventory-v01.md
          git add assets/models/creatures/fauna-optimization-v01/source/pipeline.py
          git add assets/models/creatures/arumbar/arumbar-savanna-optimized-v04-LOD*.glb
          git add assets/models/creatures/arumbar/arumbar-optimization-manifest-v04.json
          git add assets/models/creatures/arumbar/arumbar-structural-benchmark-v04.json
          git add assets/models/creatures/arumbar/arumbar-real-3d-*-optimized-v04.png
          git add assets/models/creatures/arumbar/arumbar-v03-v04-real-comparison.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(fauna): publish audited Arumbar v04 LODs and real previews [skip ci]'
            git push origin HEAD:wildhaven-fauna-global-optimization-arumbar-v04
          fi
