name: Wildhaven - Boscaranha + Carniroca Optimization
on:
  push:
    branches: [wildhaven-fauna-boscaranha-carniroca-optimization-v01]
    paths:
      - 'assets/models/creatures/fauna-optimization-v09/source/optimize_pair.py'
      - '.github/workflows/wildhaven-boscaranha-carniroca-optimization-v01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install geometry dependencies
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 trimesh==4.11.1 vtk==9.6.2 pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 fonts-dejavu-core
      - name: Optimize and validate Boscaranha + Carniroca
        run: xvfb-run -a python3 assets/models/creatures/fauna-optimization-v09/source/optimize_pair.py --root .
      - uses: actions/upload-artifact@v4
        with:
          name: wildhaven-boscaranha-carniroca-optimized-real-assets
          path: |
            assets/models/creatures/boscaranha/*optimized-v02-LOD*.glb
            assets/models/creatures/boscaranha/*optimized-v02-real-3d-*.png
            assets/models/creatures/boscaranha/*optimization-manifest-v02.json
            assets/models/creatures/carniroca/*optimized-v02-LOD*.glb
            assets/models/creatures/carniroca/*optimized-v02-real-3d-*.png
            assets/models/creatures/carniroca/*optimization-manifest-v02.json
            assets/models/creatures/fauna-optimization-v09/*.json
            assets/models/creatures/fauna-optimization-v09/previews/*.png
            docs/fauna-3d-inventory-v01.*
          if-no-files-found: error
      - name: Commit validated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/creatures/boscaranha/ assets/models/creatures/carniroca/
          git add assets/models/creatures/fauna-optimization-v09/ docs/fauna-3d-inventory-v01.*
          if ! git diff --cached --quiet; then
            git commit -m 'assets(fauna): publish Boscaranha v02 + Carniroca v02 LOD chains [skip ci]'
            git fetch origin wildhaven-fauna-boscaranha-carniroca-optimization-v01
            git rebase origin/wildhaven-fauna-boscaranha-carniroca-optimization-v01
            git push origin HEAD:wildhaven-fauna-boscaranha-carniroca-optimization-v01
          fi
