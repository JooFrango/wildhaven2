name: Wildhaven - four animated savanna herbivores v01
on:
  push:
    branches: [wildhaven-four-savanna-herbivores-v01]
    paths:
      - 'assets/models/creatures/savanna-medium-herbivores-v01/source/**'
      - 'creatures/species/talvero.json'
      - 'creatures/species/rambrel.json'
      - 'creatures/species/rambrel_chapadas.json'
      - 'creatures/species/turvagal.json'
      - '.github/workflows/wildhaven-four-savanna-herbivores-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry and genuine offline 3D render dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 vtk==9.4.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1
      - name: Generate four animated binary GLBs and true VTK screenshots
        run: |
          xvfb-run -a python3 assets/models/creatures/savanna-medium-herbivores-v01/source/generate.py --render
      - name: Validate mesh, glTF animations, manifest checksums, preview pixels
        run: |
          python3 assets/models/creatures/savanna-medium-herbivores-v01/source/validate.py
      - name: Upload all real creature models and screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wildhaven-four-savanna-herbivores-v01-real-models
          path: |
            assets/models/creatures/talvero/*.glb
            assets/models/creatures/talvero/*.png
            assets/models/creatures/talvero/*manifest*.json
            assets/models/creatures/rambrel/*.glb
            assets/models/creatures/rambrel/*.png
            assets/models/creatures/rambrel/*manifest*.json
            assets/models/creatures/rambrel_chapadas/*.glb
            assets/models/creatures/rambrel_chapadas/*.png
            assets/models/creatures/rambrel_chapadas/*manifest*.json
            assets/models/creatures/turvagal/*.glb
            assets/models/creatures/turvagal/*.png
            assets/models/creatures/turvagal/*manifest*.json
          if-no-files-found: error
      - name: Commit real binary assets to project branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/creatures/talvero/ assets/models/creatures/rambrel/ assets/models/creatures/rambrel_chapadas/ assets/models/creatures/turvagal/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(wildhaven): publish four genuine animated GLBs and VTK captures [skip ci]'
            git push origin HEAD:wildhaven-four-savanna-herbivores-v01
          fi
