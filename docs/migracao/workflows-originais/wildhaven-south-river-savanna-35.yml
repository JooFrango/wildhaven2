name: 'Wildhaven — 5 savanas 5km e rio real: 35 GLBs'
on:
  push:
    branches: [wildhaven-south-river-savanna-35hex-v01]
    paths:
      - 'world/south-river-savanna/**'
      - '.github/workflows/wildhaven-south-river-savanna-35.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-south-river-savanna-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-five-savanna-35:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas de geometria, GLB e VTK
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Exportar savanas 5km reais com rio encaixado entre cinco GLBs
        run: |
          python world/south-river-savanna/tools/build_savanna_river.py \
            --repo-root . --output-dir world/south-river-savanna
      - name: Validar doze bordas de terreno e quatro conexoes de agua reais
        run: |
          python world/south-river-savanna/tests/validate_savanna_35.py \
            --repo-root . --output-dir world/south-river-savanna
      - name: Renderizar o mundo 35 hexagonos, rio continuo e cinco savanas
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/south-river-savanna/tools/render_35_real.py \
            --repo-root . --output-dir world/south-river-savanna
      - name: Preparar visualizador Three.js sem modificar Alpha01
        run: python world/south-river-savanna/tools/build_viewer_35.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar visualizador independente de 35 GLBs
        working-directory: world/south-river-savanna/viewer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Arquivo de download completo para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-35-GLBs-Savanna-Five-Hex-River-Water
          retention-days: 30
          path: |
            world/south-river-savanna/models/*.glb
            world/south-river-savanna/manifest.json
            world/south-river-savanna/model_report.json
            world/south-river-savanna/preview/*.png
            world/south-river-savanna/viewer/dist/
      - name: Publicar novos GLBs e renders reais somente na branch de aprovação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/south-river-savanna/models \
            world/south-river-savanna/manifest.json \
            world/south-river-savanna/model_report.json \
            world/south-river-savanna/preview \
            world/south-river-savanna/viewer/index.html \
            world/south-river-savanna/viewer/main.js \
            world/south-river-savanna/viewer/package.json \
            world/south-river-savanna/viewer/copy-assets.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): 35 real GLBs with savanna and single 3D river south of plains [skip ci]'
            git push origin HEAD:wildhaven-south-river-savanna-35hex-v01
          fi
