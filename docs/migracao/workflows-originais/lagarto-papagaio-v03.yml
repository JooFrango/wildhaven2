name: Lagarto Papagaio v03 - animated real GLB
on:
  push:
    branches: [feat/lagarto-papagaio-animacoes-v03]
    paths: ['.github/workflows/lagarto-papagaio-v03.yml', 'assets/models/creatures/lagarto-papagaio/v03/source/source.tar.xz.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 Pillow==12.3.0 trimesh==4.11.1 vtk==9.6.2
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libosmesa6 libgl1-mesa-dri xvfb fonts-dejavu-core
      - name: Reconstruct v03 and validate exported GLB
        run: |
          cd assets/models/creatures/lagarto-papagaio/v03
          base64 -d source/source.tar.xz.b64 | tar -xJ
          python source/animate.py ../v02
          python - <<'PY'
          from pathlib import Path
          import json, struct, hashlib, numpy as np
          p=Path('lagarto-papagaio-v03-animado.glb')
          raw=p.read_bytes(); n=struct.unpack_from('<I',raw,12)[0]
          g=json.loads(raw[20:20+n]); b=raw[28+n:]; m=json.loads(Path('manifest.json').read_text())
          assert struct.unpack_from('<I',raw,8)[0]==len(raw)
          assert m['base_sha256']=='ea07f8dd992a1955a12ba6b538d5e380d0cb6cf16701a374ed91cc237c8e35a6'
          assert m['geometry_uv_texture_binary_preserved']
          assert len(g['animations'])==24 and len(g['skins'][0]['joints'])==24
          assert m['triangles']==4946
          assert hashlib.sha256(raw).hexdigest()==m['sha256']
          def read(i):
              a=g['accessors'][i]; v=g['bufferViews'][a['bufferView']]
              return np.frombuffer(b,dtype={5121:'u1',5125:'<u4',5126:'<f4'}[a['componentType']],count=a['count']*{'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4,'MAT4':16}[a['type']],offset=v.get('byteOffset',0)+a.get('byteOffset',0))
          pr=g['meshes'][0]['primitives'][0]; j=read(pr['attributes']['JOINTS_0']); w=read(pr['attributes']['WEIGHTS_0']).reshape(-1,4)
          assert j.max()<24 and np.allclose(w.sum(1),1) and w.min()>=0
          for a in g['animations']:
              for c in a['channels']:
                  sm=a['samplers'][c['sampler']]; t=read(sm['input']); x=read(sm['output'])
                  assert np.isfinite(x).all() and np.all(np.diff(t)>0)
                  if c['target']['path']=='rotation': assert np.allclose(np.linalg.norm(x.reshape(-1,4),axis=1),1,atol=1e-5)
          print(m)
          PY
      - name: Render actual GLB clips and separate poison VFX
        run: |
          cd assets/models/creatures/lagarto-papagaio/v03
          xvfb-run -a python source/preview.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('render_report.json').read_text())
          assert all(x['vertex_displacement_max']>.01 for x in r['rendered'].values())
          Path('validation.json').write_text(json.dumps({'source_sha256':r['source_sha256'],'structural_checks':True,'actual_movement_in_five_rendered_clips':True,'artistic_qa':False,'gameplay_integration':False},indent=2))
          PY
      - name: Publish real GLB and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures/lagarto-papagaio/v03
          git commit -m "feat(papagaio): publish v03 real rig, 24 clips and GIFs"
          git push origin HEAD:feat/lagarto-papagaio-animacoes-v03
