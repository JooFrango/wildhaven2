name: Sirocauro v05 - static real GLB visual review
on:
  push:
    branches: [feat/sirocauro-v05-reconstrucao-conceito]
    paths: ['.github/workflows/sirocauro-v05.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild and check byte identity and budget
        run: |
          node assets/models/creatures/sirocauro/v05/source/build.cjs /tmp/sirocauro-v05
          node assets/models/creatures/sirocauro/v05/source/verify.cjs assets/models/creatures/sirocauro/v05 /tmp/sirocauro-v05
      - name: Install real GLB renderer
        run: |
          npm install --no-save --no-package-lock three@0.161.0 playwright
          npx playwright install --with-deps chromium
          python -m pip install pillow
          sudo apt-get install -y fonts-dejavu-core
      - name: Render actual GLB
        run: |
          node assets/models/creatures/sirocauro/v05/source/render.mjs
          python assets/models/creatures/sirocauro/v05/source/compose.py
      - name: Publish evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures/sirocauro/v05/previews assets/models/creatures/sirocauro/v05/render_report.json assets/models/creatures/sirocauro/v05/manifest.json
          git commit -m "preview(sirocauro): verify v05 static GLB and compare concept"
          git push origin HEAD:feat/sirocauro-v05-reconstrucao-conceito
