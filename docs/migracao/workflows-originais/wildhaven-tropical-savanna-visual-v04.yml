name: Wildhaven - Savana Fiel SV4 na Transicao v04
on:
  push:
    branches: [wildhaven-tropical-savanna-visual-v04]
    paths:
      - 'world/tropical-ecology-v04/**'
      - '.github/workflows/wildhaven-tropical-savanna-visual-v04.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-tropical-savanna-visual-v04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas 3D e render
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Gerar SOMENTE quatro TR com paleta aprovada SV4
        run: |
          python world/tropical-ecology-v04/tools/build_visual_v04.py \
            --repo-root . \
            --source-dir world/tropical-ecology-v03 \
            --historical-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-ecology-v04
      - name: Conferir cores oficiais, 19 bordas, vegetacao e 54 GLBs intocados
        run: |
          python world/tropical-ecology-v04/tests/validate_visual_v04.py \
            --repo-root . \
            --source-dir world/tropical-ecology-v03 \
            --historical-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-ecology-v04
      - name: Renderizar as previews reais
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/tropical-ecology-v04/tools/render_visual_v04.py \
            --repo-root . \
            --source-dir world/savanna-south-expansion-v02 \
            --output-dir world/tropical-ecology-v04
      - name: Arquivar quatro GLBs e previews
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-4-TR-Savana-Fiel-v04
          retention-days: 30
          path: |
            world/tropical-ecology-v04/models/*.glb
            world/tropical-ecology-v04/manifest.json
            world/tropical-ecology-v04/model_report.json
            world/tropical-ecology-v04/audit/*.gz
            world/tropical-ecology-v04/preview/*.png
      - name: Publicar somente nesta branch de aprovacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/tropical-ecology-v04/models \
            world/tropical-ecology-v04/manifest.json \
            world/tropical-ecology-v04/model_report.json \
            world/tropical-ecology-v04/audit \
            world/tropical-ecology-v04/preview
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): four official-savanna-color transition GLBs [skip ci]'
            git push origin HEAD:wildhaven-tropical-savanna-visual-v04
          fi
