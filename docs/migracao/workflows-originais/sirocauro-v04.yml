name: Sirocauro v04 - real GLB visual review
on:
  push:
    branches: [feat/sirocauro-v04-anatomia-animacoes]
    paths: ['.github/workflows/sirocauro-v04.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install renderer
        run: |
          npm install --no-save --no-package-lock three@0.161.0 playwright
          npx playwright install --with-deps chromium
          python -m pip install pillow
          sudo apt-get install -y fonts-dejavu-core
      - name: Rebuild and confirm published binary
        run: |
          node assets/models/creatures/sirocauro/v04/source/upgrade.cjs assets/models/creatures/sirocauro/v03/sirocauro-v03-rig41-malha-corrigida.glb /tmp/sirocauro-v04.glb
          cmp /tmp/sirocauro-v04.glb assets/models/creatures/sirocauro/v04/sirocauro-v04.glb
          sha256sum assets/models/creatures/sirocauro/v04/sirocauro-v04.glb
      - name: Render actual GLB and clips
        run: |
          node assets/models/creatures/sirocauro/v04/source/render.mjs
          python assets/models/creatures/sirocauro/v04/source/compose.py
          rm -rf assets/models/creatures/sirocauro/v04/previews/frames
      - name: Publish visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures/sirocauro/v04/previews assets/models/creatures/sirocauro/v04/render_report.json
          git commit -m "preview(sirocauro): real v04 GLB views, comparison, six animated clips"
          git push origin HEAD:feat/sirocauro-v04-anatomia-animacoes
