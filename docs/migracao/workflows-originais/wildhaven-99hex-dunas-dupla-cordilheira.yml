name: Wildhaven - 99 Hex Dupla Cordilheira e Mar de Dunas v01

on:
  push:
    branches: [wildhaven-cordilheira-dupla-mar-dunas-99hex-v01]
    paths:
      - .github/workflows/wildhaven-99hex-dunas-dupla-cordilheira.yml
      - world/dune-sea-second-ridge-v01/tools/build_dunes_ridge_v01.py
      - world/dune-sea-second-ridge-v01/tools/render_99hex_v01.py
      - world/dune-sea-second-ridge-v01/tests/validate_99hex_v01.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wildhaven-99hex-dupla-cordilheira-mar-dunas
  cancel-in-progress: false

jobs:
  model-verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup real mesh and headless renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" "scipy>=1.11" "trimesh>=4.7" "pillow>=10" "vtk>=9.3"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1

      - name: Verify generator and test source syntax
        run: |
          python -m py_compile world/dune-sea-second-ridge-v01/tools/build_dunes_ridge_v01.py
          python -m py_compile world/dune-sea-second-ridge-v01/tools/render_99hex_v01.py
          python -m py_compile world/dune-sea-second-ridge-v01/tests/validate_99hex_v01.py

      - name: Build 33 real dune and mountain GLBs and new collision
        run: python world/dune-sea-second-ridge-v01/tools/build_dunes_ridge_v01.py

      - name: Independently validate all 93 new seams and exported 3D geometry
        run: python world/dune-sea-second-ridge-v01/tests/validate_99hex_v01.py

      - name: Render 99 connected GLBs and biome-specific real closeups
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VTK_DEFAULT_OPENGL_WINDOW: vtkXOpenGLRenderWindow
        run: xvfb-run -a python world/dune-sea-second-ridge-v01/tools/render_99hex_v01.py --repo-root .

      - name: Commit new GLBs, collision, manifests, audits and actual GLB previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world/dune-sea-second-ridge-v01
          git diff --cached --stat
          git commit -m "assets(world): publish 25 dune GLBs and eight connected mountain GLBs [skip ci]"
          git push origin HEAD:wildhaven-cordilheira-dupla-mar-dunas-99hex-v01
