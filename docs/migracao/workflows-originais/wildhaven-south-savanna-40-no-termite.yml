name: 'Wildhaven — segunda fileira de 5 savanas fantasticas 5km sem cupinzeiros'
on:
  push:
    branches: [wildhaven-south-savanna-40hex-no-termite-v01]
    paths:
      - 'world/south-savanna-expansion/**'
      - '.github/workflows/wildhaven-south-savanna-40-no-termite.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-south-savanna-40-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-five-savanna-40:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas de geometria, GLB e VTK
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Exportar cinco GLBs 5km de savana sem cupinzeiros
        run: |
          python world/south-savanna-expansion/tools/build_south_savanna.py \
            --repo-root . --output-dir world/south-savanna-expansion
      - name: Validar 13 bordas, 5 GLBs 3D, e zero cupinzeiros
        run: |
          python world/south-savanna-expansion/tests/validate_40_real_glbs.py \
            --repo-root . --output-dir world/south-savanna-expansion
      - name: Renderizar o mundo 40 hexagonos e as novas 5 savanas
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/south-savanna-expansion/tools/render_40_real.py \
            --repo-root . --output-dir world/south-savanna-expansion
      - name: Preparar visualizador Three.js sem modificar Alpha01
        run: python world/south-savanna-expansion/tools/build_viewer_40.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar visualizador independente de 40 GLBs
        working-directory: world/south-savanna-expansion/viewer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Arquivo de download completo para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-40-Hexagonos-Fantasia-5-Savanas-Sem-Cupinzeiros-GLB
          retention-days: 30
          path: |
            world/south-savanna-expansion/models/*.glb
            world/south-savanna-expansion/manifest.json
            world/south-savanna-expansion/model_report.json
            world/south-savanna-expansion/preview/*.png
            world/south-savanna-expansion/viewer/dist/
      - name: Publicar novos GLBs e renders reais somente na branch de aprovação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/south-savanna-expansion/models \
            world/south-savanna-expansion/manifest.json \
            world/south-savanna-expansion/model_report.json \
            world/south-savanna-expansion/preview \
            world/south-savanna-expansion/viewer/index.html \
            world/south-savanna-expansion/viewer/main.js \
            world/south-savanna-expansion/viewer/package.json \
            world/south-savanna-expansion/viewer/copy-assets.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): 40 real GLBs with 5 new fantasy savannas and no termite mounds [skip ci]'
            git push origin HEAD:wildhaven-south-savanna-40hex-no-termite-v01
          fi
