name: 'Wildhaven — expansão sul 49 hex com lago v02'
on:
  push:
    branches: [wildhaven-savanna-south-expansion-v02]
    paths:
      - 'world/savanna-south-expansion-v02/**'
      - '.github/workflows/wildhaven-savanna-south-expansion-v02.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-savanna-south-expansion-v02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-south-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar geometria e render
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'trimesh>=4,<5' 'vtk>=9,<10'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
      - name: Gerar cinco novos hexágonos ao sul
        run: |
          python world/savanna-south-expansion-v02/tools/build_south_row_v02.py \
            --repo-root . \
            --source-dir world/environmental-polish/final \
            --output-dir world/savanna-south-expansion-v02
      - name: Validar 49 hexágonos, 114 conexões e Lago Rubro
        run: |
          python world/savanna-south-expansion-v02/tests/validate_south_row_v02.py \
            --repo-root . \
            --source-dir world/environmental-polish/final \
            --output-dir world/savanna-south-expansion-v02
      - name: Renderizar composição real
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a python world/savanna-south-expansion-v02/tools/render_south_row_v02.py \
            --repo-root . \
            --source-dir world/environmental-polish/final \
            --output-dir world/savanna-south-expansion-v02
      - name: Artefato de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-49-Hex-South-v02-With-Lake
          retention-days: 30
          path: |
            world/savanna-south-expansion-v02/models/*.glb
            world/savanna-south-expansion-v02/manifest.json
            world/savanna-south-expansion-v02/model_report.json
            world/savanna-south-expansion-v02/preview/*.png
      - name: Publicar somente na branch de aprovação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f world/savanna-south-expansion-v02/models \
            world/savanna-south-expansion-v02/manifest.json \
            world/savanna-south-expansion-v02/model_report.json \
            world/savanna-south-expansion-v02/preview
          if ! git diff --cached --quiet; then
            git commit -m 'build(world): 49 real hexes with five-tile south expansion and one lake [skip ci]'
            git push origin HEAD:wildhaven-savanna-south-expansion-v02
          fi
