name: Wildhaven - Cascarrumo + Tarruco Optimization
on:
  push:
    branches: [wildhaven-fauna-cascarrumo-tarruco-optimization-v01]
    paths:
      - 'assets/models/creatures/fauna-optimization-v04/source/**'
      - '.github/workflows/wildhaven-cascarrumo-tarruco-optimization-v01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize-two-species:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: |
          python3 -m pip install --disable-pip-version-check             numpy==2.2.6 scipy==1.15.3 trimesh==4.11.1             vtk==9.6.2 pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1
      - name: Optimize Cascarrumo and Tarruco
        run: |
          xvfb-run -a python3 assets/models/creatures/fauna-optimization-v04/source/optimize_pair.py --root .
      - name: Upload real GLBs, manifests and previews
        uses: actions/upload-artifact@v4
        with:
          name: wildhaven-cascarrumo-tarruco-real-optimized-assets
          path: |
            assets/models/creatures/detritivoros/cascarrumo-optimized-v02-LOD*.glb
            assets/models/creatures/detritivoros/cascarrumo-optimized-v02-real-3d-*.png
            assets/models/creatures/detritivoros/cascarrumo-optimization-manifest-v02.json
            assets/models/creatures/detritivoros/cascarrumo-structural-benchmark-v02.json
            assets/models/creatures/tarruco/tarruco-savanna-optimized-v02-LOD*.glb
            assets/models/creatures/tarruco/tarruco-savanna-optimized-v02-real-3d-*.png
            assets/models/creatures/tarruco/tarruco-optimization-manifest-v02.json
            assets/models/creatures/tarruco/tarruco-structural-benchmark-v02.json
            assets/models/creatures/fauna-optimization-v04/previews/*.png
            docs/fauna-3d-inventory-v01.json
            docs/fauna-3d-inventory-v01.md
          if-no-files-found: error
      - name: Commit validated results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/creatures/detritivoros/
          git add assets/models/creatures/tarruco/
          git add assets/models/creatures/fauna-optimization-v04/previews/
          git add docs/fauna-3d-inventory-v01.json docs/fauna-3d-inventory-v01.md
          if ! git diff --cached --quiet; then
            git commit -m 'assets(fauna): publish Cascarrumo v02 and Tarruco v02 LODs + real previews [skip ci]'
            git fetch origin wildhaven-fauna-cascarrumo-tarruco-optimization-v01
            git rebase origin/wildhaven-fauna-cascarrumo-tarruco-optimization-v01
            git push origin HEAD:wildhaven-fauna-cascarrumo-tarruco-optimization-v01
          fi
