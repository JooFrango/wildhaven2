name: Wildhaven - Cordilheira Oeste 8 Hex e Bloqueio v01

on:
  push:
    branches: [wildhaven-cordilheira-oeste-bloqueio-v01]
    paths:
      - .github/workflows/wildhaven-cordilheira-oeste-v01.yml
      - world/west-mountain-barrier-v01/tools/build_west_ridge_v01.py
      - world/west-mountain-barrier-v01/tests/validate_west_ridge_v01.py
      - world/west-mountain-barrier-v01/tools/render_connected_v01.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wildhaven-west-ridge-v01
  cancel-in-progress: false

jobs:
  build-validate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh, GIS and software rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" "scipy>=1.11" "trimesh>=4.7" "pillow>=10" "vtk>=9.3"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1
      - name: Check generator syntax
        run: |
          python -m py_compile world/west-mountain-barrier-v01/tools/build_west_ridge_v01.py
          python -m py_compile world/west-mountain-barrier-v01/tests/validate_west_ridge_v01.py
          python -m py_compile world/west-mountain-barrier-v01/tools/render_connected_v01.py
      - name: Build eight actual 5-km mountain GLBs and continuous collision spine
        run: python world/west-mountain-barrier-v01/tools/build_west_ridge_v01.py
      - name: Independently verify 25 exported GLB border seams and barrier collider
        run: python world/west-mountain-barrier-v01/tests/validate_west_ridge_v01.py
      - name: Render exported 66-hex world and 8 mountain perspectives
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VTK_DEFAULT_OPENGL_WINDOW: vtkXOpenGLRenderWindow
        run: xvfb-run -a python world/west-mountain-barrier-v01/tools/render_connected_v01.py --repo-root .
      - name: Commit REAL GLBs, collision, navigation graph, tests and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world/west-mountain-barrier-v01
          git diff --cached --stat
          git commit -m "assets(world): eight connected mountain GLBs and collision spine [skip ci]"
          git push origin HEAD:wildhaven-cordilheira-oeste-bloqueio-v01
