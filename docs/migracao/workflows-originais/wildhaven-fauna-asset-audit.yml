name: Wildhaven - fauna asset audit
on:
  push:
    branches: [main, wildhaven-fauna-asset-audit-v01]
    paths:
      - 'tools/fauna-audit/**'
      - 'creatures/species/**'
      - '.github/workflows/wildhaven-fauna-asset-audit.yml'
  pull_request:
    paths:
      - 'tools/fauna-audit/**'
      - 'creatures/species/**'
      - '.github/workflows/wildhaven-fauna-asset-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fauna-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser and catalog auditing with synthetic GLBs
        run: python3 -m unittest discover -s tools/fauna-audit -p 'test_*.py' -v
      - name: Audit referenced species assets and animations (advisory)
        run: python3 tools/fauna-audit/audit.py --root . --output fauna-audit.json
      - name: Preserve machine-readable audit for review
        uses: actions/upload-artifact@v4
        with:
          name: wildhaven-fauna-asset-audit
          path: fauna-audit.json
          if-no-files-found: error
