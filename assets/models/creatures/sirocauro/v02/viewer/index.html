<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Wildhaven — Sirocauro v02 / 41 clipes</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#141919;color:#e3e7db;font-family:system-ui,sans-serif}canvas{display:block}aside{position:absolute;z-index:2;top:16px;left:16px;padding:17px;background:#18211de8;border:1px solid #435248;border-radius:12px;min-width:260px;max-width:350px}h1{font-size:17px;margin:0 0 9px}p{font-size:12px;color:#b9c6b4;line-height:1.5}select,button,input{accent-color:#a2bc8f;background:#29372f;color:#e8efe1;border:1px solid #536d58;border-radius:5px;padding:6px;max-width:100%}select{width:100%;margin:8px 0}button{cursor:pointer}nav{display:flex;gap:6px;flex-wrap:wrap}.status{font-size:12px;color:#c7d6bf}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script></head><body><aside><h1>Sirocauro • v02 experimental</h1><div class="status" id="status">Carregando GLB real…</div><label for="clip">41 clipes incorporados</label><select id="clip"></select><nav><button id="side">Perfil</button><button id="front">Frente</button><button id="quarter">¾</button><button id="skeleton">Esqueleto</button></nav><p>Velocidade <input id="speed" type="range" min=".1" max="2" value="1" step=".1"><span id="rate">1.0x</span></p><p>Modelo GLB real recuperado do diretório, com skin e clipes. Movimentos experimentais: IK de solo, física e IA tática ainda não ligados. Requer servidor HTTP local; GitHub não executa esta página na aba de código.</p></aside><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#181e1b');const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.up.set(0,0,1);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#f7eee0','#58685e',2));const sun=new THREE.DirectionalLight('#fff0d9',3);sun.position.set(-8,-10,16);scene.add(sun);const grid=new THREE.GridHelper(50,50,'#657067','#363e38');grid.rotation.x=Math.PI/2;scene.add(grid);const ctl=new OrbitControls(camera,renderer.domElement);ctl.target.set(1,0,2.9);ctl.enableDamping=true;function place(x,y,z){camera.position.set(x,y,z);ctl.update()}place(-13,-16,8);
let mixer,active,clips=[],skel;const status=document.getElementById('status'),sel=document.getElementById('clip');
new GLTFLoader().load('../sirocauro-v02-rig41-LOD0.glb',g=>{scene.add(g.scene);clips=g.animations;mixer=new THREE.AnimationMixer(g.scene);clips.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;sel.appendChild(o)});skel=new THREE.SkeletonHelper(g.scene);skel.visible=false;scene.add(skel);status.textContent='GLB carregado: '+clips.length+' animações';play('idle')},undefined,e=>status.textContent='Falha ao carregar GLB: '+e.message);
function play(name){if(!mixer)return;const c=clips.find(v=>v.name===name);if(!c)return;const action=mixer.clipAction(c);action.reset();const end=!['idle','walk','run','sprint','backstep','strafe_left','strafe_right','turn_left','turn_right','alert','rest','eat','grab_hold','exhausted','storm_sustain'].includes(c.name);action.setLoop(end?THREE.LoopOnce:THREE.LoopRepeat,Infinity);action.clampWhenFinished=end;action.play();if(active&&active!==action)active.crossFadeTo(action,.22,false);active=action}
sel.addEventListener('change',()=>play(sel.value));document.getElementById('side').onclick=()=>place(0,-19,5);document.getElementById('front').onclick=()=>place(-20,0,5);document.getElementById('quarter').onclick=()=>place(-13,-16,8);document.getElementById('skeleton').onclick=()=>{if(skel)skel.visible=!skel.visible};
document.getElementById('speed').oninput=e=>{document.getElementById('rate').textContent=(+e.target.value).toFixed(1)+'x';if(mixer)mixer.timeScale=+e.target.value};const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=clock.getDelta();if(mixer)mixer.update(dt);ctl.update();renderer.render(scene,camera)}tick();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
