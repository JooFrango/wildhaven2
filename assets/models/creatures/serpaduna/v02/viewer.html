<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildhaven — Serpáduna v02 / Inspeção do GLB</title>
<style>body{margin:0;background:#1c1b19;color:#ebd9b4;font:15px system-ui}aside{position:absolute;top:16px;left:16px;background:#25231edb;border:1px solid #82765c;border-radius:12px;padding:16px;z-index:4;max-width:290px}select,input{background:#38342b;color:#f0e5d2;padding:7px;border:1px solid #8d795b}label{display:block;margin:11px 0}small{color:#b5ac9b}canvas{display:block;width:100%;height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head>
<body><aside><b>WILDHAVEN — SERPÁDUNA v02</b><label>Clipes reais do GLB <select id="clips"></select></label><label><input type="checkbox" id="repeat" checked> Repetir animação</label><label><input type="checkbox" id="wire"> Visualizar malha</label><label><input type="range" min="0.1" max="2" step="0.1" value="1" id="speed"> Velocidade</label><small id="status">Carregando GLB…</small></aside><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.setClearColor(0x221e1a);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.01,100);cam.position.set(-7,-8,5);cam.up.set(0,0,1);cam.lookAt(0,0,1);const orbit=new OrbitControls(cam,r.domElement);orbit.target.set(0,0,1);orbit.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xfaf0dd,0x65513e,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-4,-4,9);scene.add(light);const grid=new THREE.GridHelper(12,24,0x725c43,0x443b30);grid.rotation.x=Math.PI/2;grid.position.z=-.2;scene.add(grid);
let mixer,mesh,actions=[],active;const status=document.querySelector('#status'),clips=document.querySelector('#clips');
new GLTFLoader().load('serpaduna_v02_rig_animated.glb',g=>{mesh=g.scene;scene.add(mesh);mixer=new THREE.AnimationMixer(mesh);actions=g.animations.map(x=>mixer.clipAction(x));for(const c of g.animations){const opt=document.createElement('option');opt.value=c.name;opt.textContent=c.name+' ('+c.duration.toFixed(1)+'s)';clips.appendChild(opt)}
const choose=()=>{if(active)active.fadeOut(.18);const i=g.animations.findIndex(x=>x.name===clips.value);active=actions[i];active.reset();active.clampWhenFinished=true;active.setLoop(document.querySelector('#repeat').checked?THREE.LoopRepeat:THREE.LoopOnce);active.fadeIn(.18).play()};clips.addEventListener('change',choose);document.querySelector('#repeat').addEventListener('change',choose);document.querySelector('#wire').addEventListener('change',e=>mesh.traverse(o=>{if(o.isMesh)o.material.wireframe=e.target.checked}));status.textContent=`${g.animations.length} animações / ${g.scene.getObjectByName('axis_00_tail_tip')?'skin verificado':'GLB carregado'}`;choose();},undefined,e=>status.textContent='Erro ao carregar GLB: '+e.message);
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const t=clock.getDelta();if(mixer)mixer.update(t*+document.querySelector('#speed').value);orbit.update();r.render(scene,cam)}frame();onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
</script></body></html>
