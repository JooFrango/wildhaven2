<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildhaven — Quatro herbívoros da savana | GLB real</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#111b20;color:#e6ede6}
header{padding:14px 18px;background:#19262b;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
h1{font-size:17px;margin:0 14px 0 0}label{font-size:13px;color:#b4cbbf}
select,button{background:#263a3d;color:#eef5ef;border:1px solid #517370;border-radius:8px;padding:8px 10px}
main{height:calc(100vh - 100px);min-height:400px}#scene{height:100%;width:100%}
footer{font-size:12px;padding:8px 14px;color:#a3bdb5;background:#19262b}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"}}</script>
</head>
<body><header>
<h1>Wildhaven · Herbívoros 3D</h1>
<label>Modelo <select id="species">
<option value="talvero">Talvero</option>
<option value="rambrel">Rambrél comum</option>
<option value="rambrel_chapadas">Rambrél gigante</option>
<option value="turvagal">Turvagal</option>
</select></label>
<label>Animação <select id="clip"></select></label>
<button id="play">Pausar</button>
<button id="fit">Centralizar</button>
</header>
<main><div id="scene"></div></main>
<footer id="status">Visualizador de GLBs 3D reais. Execute através de um servidor HTTP local, não de file://.</footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(host.clientWidth,host.clientHeight);
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#a4bec3');
scene.fog=new THREE.Fog('#a4bec3',18,45);
const camera=new THREE.PerspectiveCamera(46,host.clientWidth/host.clientHeight,.01,400);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
const ambient=new THREE.HemisphereLight(0xeaf6fd,0x867157,2.0);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffedc7,2.6);sun.position.set(-5,10,9);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x9b946c,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.15;scene.add(ground);
let model=null,mixer=null,actions=[],active=null,paused=false,box=new THREE.Box3();
const clock=new THREE.Clock();
const spec=document.getElementById('species');
const clip=document.getElementById('clip');
const status=document.getElementById('status');
function fit(){
 if(!model)return;
 box.setFromObject(model);
 const center=box.getCenter(new THREE.Vector3());
 const size=box.getSize(new THREE.Vector3());
 const extent=Math.max(size.x,size.y,size.z);
 controls.target.copy(center);
 camera.position.copy(center).add(new THREE.Vector3(extent*.95,extent*.57,extent*1.25));
 camera.near=Math.max(.005,extent*.002);
 camera.far=400;
 camera.updateProjectionMatrix();
 controls.update();
}
function play(name){
 if(!mixer)return;
 if(active)active.fadeOut(.2);
 active=actions.find(a=>a.getClip().name===name)||actions[0];
 if(!active)return;
 active.reset().fadeIn(.2).play();
 active.paused=paused;
}
async function load(){
 const id=spec.value;
 status.textContent='Abrindo malha 3D real: '+id+'…';
 if(model){scene.remove(model);mixer?.stopAllAction();model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose();}})}
 const uri='../../'+id+'/'+id+'-savanna-animated-v01.glb';
 try{
  const gltf=await new GLTFLoader().loadAsync(uri);
  model=gltf.scene;scene.add(model);
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  mixer=new THREE.AnimationMixer(model);
  actions=gltf.animations.map(c=>mixer.clipAction(c));
  clip.replaceChildren(...gltf.animations.map(c=>{const x=document.createElement('option');x.value=x.textContent=c.name;return x}));
  fit();paused=false;document.getElementById('play').textContent='Pausar';
  play('idle');
  status.textContent=id+' · '+gltf.animations.length+' clipes incorporados ao GLB · animações por pivôs (sem skinning)';
 }catch(e){status.textContent='Falha ao carregar '+uri+': '+e.message;console.error(e)}
}
spec.addEventListener('change',load);
clip.addEventListener('change',()=>play(clip.value));
document.getElementById('fit').addEventListener('click',fit);
document.getElementById('play').addEventListener('click',()=>{paused=!paused;if(active)active.paused=paused;document.getElementById('play').textContent=paused?'Reproduzir':'Pausar'});
new ResizeObserver(()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}).observe(host);
function tick(){requestAnimationFrame(tick);const dt=clock.getDelta();mixer?.update(dt);controls.update();renderer.render(scene,camera)}
tick();load();
</script></body></html>
