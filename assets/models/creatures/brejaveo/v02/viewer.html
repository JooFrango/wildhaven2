<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Wildhaven • Brejáveo v02 — animações reais</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14211a;color:#efead3;font:15px system-ui,sans-serif}header{padding:12px 16px;background:#263d2e;display:flex;align-items:center;gap:14px;flex-wrap:wrap}strong{font-size:19px}select,button,input{font:inherit;color:#fff;background:#385743;border:1px solid #78977a;border-radius:6px;padding:7px}button{cursor:pointer}#stage{height:calc(100vh - 108px);min-height:400px}footer{padding:10px 16px;color:#afc7b1;font-size:13px}label{display:flex;align-items:center;gap:6px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body><header><strong>BREJÁVEO v02</strong><label>Clipe<select id="clip"></select></label><button id="pause">Pausar</button><label>Velocidade <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1"/></label><span id="status">Carregando GLB…</span></header><div id="stage"></div><footer>GLB real · 33 juntas · 24 clipes · não integrado na Alpha · textura UV e rig embutidos. Execute <code>python -m http.server 8000</code> na pasta v02 e acesse <code>http://localhost:8000/viewer.html</code>.</footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('stage'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b2d25);const camera=new THREE.PerspectiveCamera(45,host.clientWidth/host.clientHeight,.04,500);camera.up.set(0,0,1);camera.position.set(-9,-11,6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(host.clientWidth,host.clientHeight);renderer.setPixelRatio(Math.min(2,window.devicePixelRatio));host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.2,0,1.5);controls.update();scene.add(new THREE.HemisphereLight(0xe4f7ea,0x473622,2.1));const sun=new THREE.DirectionalLight(0xffe5ad,3);sun.position.set(-6,-8,12);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x294531,roughness:1}));floor.position.z=-.07;scene.add(floor);const grid=new THREE.GridHelper(20,20,0x506d54,0x354f39);grid.rotation.x=Math.PI/2;grid.position.z=-.05;scene.add(grid);
let mixer,action,current,paused=false;const clock=new THREE.Clock();function play(name){if(!mixer)return;const clip=current?.clips.find(c=>c.name===name);if(!clip)return;action?.stop();action=mixer.clipAction(clip);action.reset();action.setLoop(name==='death'?THREE.LoopOnce:THREE.LoopRepeat);action.clampWhenFinished=name==='death';action.play();}
new GLTFLoader().load('brejaveo-v02-skinned-animated-LOD0.glb',g=>{current=g;scene.add(g.scene);mixer=new THREE.AnimationMixer(g.scene);const sel=document.getElementById('clip');for(const c of g.animations){const opt=document.createElement('option');opt.value=c.name;opt.textContent=c.name;sel.appendChild(opt);}sel.addEventListener('change',()=>play(sel.value));sel.value='tongue_strike';play(sel.value);status.textContent=`${g.animations.length} clipes carregados`;},undefined,e=>{status.textContent='Falha ao carregar o GLB: '+e.message;});
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Retomar':'Pausar';};window.onresize=()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);};function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(mixer&&!paused)mixer.update(dt*Number(document.getElementById('speed').value));renderer.render(scene,camera)}loop();
</script></body></html>
