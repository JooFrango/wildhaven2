<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildhaven | Arumbar v01 — estúdio 3D real</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#343b32;color:#f0ecdd;overflow:hidden;font:14px system-ui}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:absolute;top:18px;left:20px;padding:15px 19px;background:#222c25db;border-radius:12px;border:1px solid #79927388;max-width:460px}
h1{font:30px Georgia,serif;margin:0 0 5px;color:#edd5ac}
p{margin:3px 0;color:#e5dac6;font-size:13px}
#actions{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:12px;background:#233028e8;border-radius:12px;border:1px solid #81916d;display:flex;align-items:center;justify-content:center;gap:9px;max-width:97%;flex-wrap:wrap}
select,button{border:1px solid #9aab85;border-radius:7px;background:#41583b;color:#fff;padding:9px;cursor:pointer;font:inherit}
#status{font-size:12px;color:#e3d6b2}
</style>
</head><body>
<canvas id="world"></canvas>
<header><h1>Arumbar · Titã das Savanas</h1>
<p>Herbívoro blindado raro · Predominantemente solitário</p>
<p>Modelo mid-poly real, 8 animações, versão 0.1.</p>
<p>Arraste para girar · roda para aproximar · Não integrado à Alpha.</p></header>
<div id="actions"><label for="action">Animação:</label>
<select id="action">
<option value="idle">Parado</option>
<option value="walk">Caminhada</option>
<option value="run">Corrida</option>
<option value="graze">Pastagem</option>
<option value="drink">Beber</option>
<option value="alert">Alerta</option>
<option value="charge">Investida</option>
<option value="death">Morte</option>
</select>
<button id="restart" type="button">Reiniciar animação</button>
<span id="status">Malha e rig 3D reais</span></div>
<script type="module" src="./viewer.mjs"></script>
</body></html>
