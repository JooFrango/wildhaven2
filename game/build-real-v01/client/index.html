<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildhaven — Build Real v01</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; }
      canvas.pixel { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; background: #111; z-index: 0; }
      .box { z-index: 2; background: rgba(13,17,23,.86); border: 1px solid #30363d; border-radius: 8px; padding: 8px 10px; }
      #hud { position: fixed; top: 10px; left: 10px; width: 360px; }
      #hud h1 { font-size: 14px; margin: 0 0 6px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      dt { color: #8b949e; } dd { margin: 0; font-variant-numeric: tabular-nums; }
      .muted, small { color: #8b949e; }
      #painel { z-index: 2; position: fixed; top: 10px; right: 10px; width: 330px; max-height: calc(100vh - 340px); overflow: auto; display: flex; flex-direction: column; gap: 8px; }
      #hunters { display: grid; gap: 4px; }
      .hrow { display: grid; grid-template-columns: 1fr 70px; grid-template-rows: auto auto; text-align: left; background: #161b22; color: inherit; border: 1px solid #30363d; border-radius: 6px; padding: 4px 6px; cursor: pointer; }
      .hrow small { grid-column: 1 / 3; } .hrow.sel { border-color: #58a6ff; } .hrow.dead { opacity: .5; text-decoration: line-through; }
      .hp { height: 6px; background: #30363d; border-radius: 3px; align-self: center; } .hp i { display: block; height: 100%; background: #2ea043; border-radius: 3px; }
      .skills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; } .skills span { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 0 4px; font-size: 11px; }
      button { font: inherit; } .cta { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; margin: 6px 6px 0 0; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; } .row button { background: #21262d; color: inherit; border: 1px solid #30363d; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
      .pages { display: flex; flex-wrap: wrap; gap: 4px; } .page { background: #161b22; color: inherit; border: 1px solid #30363d; border-radius: 6px; padding: 2px 6px; cursor: pointer; } .page.sel { border-color: #3fb950; }
      .detail h3 { margin: 6px 0 2px; font-size: 13px; } .mapinha { display: block; margin-top: 4px; background: #0d1117; border-radius: 4px; }
      #dialogo { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 360px; z-index: 5; display: grid; gap: 4px; }
      #dialogo[hidden] { display: none; }
      #inventario { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: 520px; }
      #map { position: fixed; right: 10px; bottom: 10px; width: 300px; height: 300px; }
      #log { position: fixed; left: 10px; bottom: 10px; width: 420px; max-height: 32vh; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud" class="box"><h1>Wildhaven — Build Real v01</h1><dl id="stats"></dl>
      <div class="muted" style="margin-top:6px;font-size:11px">Hunters autônomos: você dá ordens e observa. Arraste para orbitar a câmera (não afeta a simulação). E: Modo Econômico · F: malha física.</div></div>
    <div id="painel">
      <div class="box"><b>Hunters</b> <span id="money" class="muted"></span><div id="hunters" style="margin-top:4px"></div>
        <div class="row" style="margin-top:6px"><button id="explorar">Explorar</button><button id="recolher">Recolher exploradores</button><button id="modo">Modo Econômico</button></div></div>
      <div class="box" id="ficha"></div>
      <div class="box" id="bestiario"><b>Bestiário</b><div class="pages" style="margin-top:4px"></div><div class="detail"></div></div>
      <div class="box" id="dialogo" hidden></div>
    </div>
    <div id="inventario" class="box muted"></div>
    <canvas id="map" class="box" width="600" height="600"></canvas>
    <div id="log" class="box"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
