<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildhaven — Build Real v01</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; }
      #hud { position: fixed; top: 12px; left: 12px; max-width: 360px; background: rgba(13,17,23,.82); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; }
      #hud h1 { font-size: 14px; margin: 0 0 6px; }
      #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      #hud dt { color: #8b949e; } #hud dd { margin: 0; font-variant-numeric: tabular-nums; }
      #hud .note { color: #8b949e; margin-top: 6px; font-size: 11px; }
      #map { position: fixed; right: 12px; bottom: 12px; width: 300px; height: 300px; background: rgba(13,17,23,.82); border: 1px solid #30363d; border-radius: 8px; }
      #log { position: fixed; left: 12px; bottom: 12px; max-width: 420px; max-height: 30vh; overflow: auto; background: rgba(13,17,23,.82); border: 1px solid #30363d; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud"><h1>Wildhaven — Build Real v01</h1><dl id="stats"></dl>
      <div class="note">Hunter autônomo (sem controle direto). Arraste para orbitar a câmera; a câmera não afeta a simulação nem o streaming. Tecla F: mostra a malha física WHP1 (depuração).</div></div>
    <canvas id="map" width="600" height="600"></canvas>
    <div id="log"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
