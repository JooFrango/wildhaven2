[package]
name = "wh-server"
description = "Servidor autoritativo HTTP/WebSocket do Wildhaven Build Real v01."
default-run = "wh-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wh-core = { path = "../wh-core" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-postgres = "0.7"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[[bin]]
name = "wh-server"
path = "src/main.rs"

[[bin]]
name = "wh-sim-check"
path = "src/bin/sim_check.rs"

[[bin]]
name = "wh-bench"
path = "src/bin/bench.rs"
