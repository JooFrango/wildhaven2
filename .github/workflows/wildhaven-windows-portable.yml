name: Wildhaven Windows portable
on:
  push:
    branches: [preview/build-real-v01-windows-portable]
    paths:
      - '.github/workflows/wildhaven-windows-portable.yml'
      - 'game/build-real-v01/tools/Iniciar-Wildhaven.bat'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout leve com historico dos terrenos
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git clone --filter=blob:none --sparse --branch preview/build-real-v01-windows-portable https://github.com/JooFrango/wildhaven2.git src
          cd src
          git checkout --detach "$GITHUB_SHA"
          git sparse-checkout set "build real/continental" "build real/integracao" game/build-real-v01 assets/hunters/hunter-workshop/base assets/models/creatures/folhisco assets/models/creatures/lobrapedra assets/models/creatures/dodarro creatures/species
          git cat-file -e '0a7aab5cfaa8446f6ddcbd5fb567516ad83d7d7c^{commit}' || git fetch origin 0a7aab5cfaa8446f6ddcbd5fb567516ad83d7d7c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar os sete terrenos reais
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          node "build real/continental/tools/fetch-sources.mjs" --out .generated/sources --around HV_01
          node "build real/continental/compiler/cli.mjs" --all --around HV_01 --old-root .generated/sources/old-root --new-root .generated/sources/new-root --out .generated/physics-272 --res 2 --chunk 256 --node-classes "build real/continental/compiler/node-classes-v01.json" --snap-centers lattice
      - name: Compilar cliente
        shell: bash
        working-directory: src/game/build-real-v01/client
        run: npm ci && npm run build
      - name: Compilar servidor Windows
        shell: pwsh
        working-directory: src/game/build-real-v01/server
        run: |
          rustup update stable
          rustup default stable
          cargo build --locked --release -p wh-server --bin wh-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Montar distribuicao sem ferramentas de desenvolvimento
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          out=../Wildhaven-Windows
          mkdir -p "$out/game/build-real-v01/client" "$out/game/build-real-v01/server" "$out/build real/continental/data" "$out/build real/integracao"
          cp -r .generated "$out/"
          cp -r assets creatures "$out/"
          cp -r game/build-real-v01/client/dist "$out/game/build-real-v01/client/"
          cp -r game/build-real-v01/data "$out/game/build-real-v01/"
          cp -r game/build-real-v01/server/migrations "$out/game/build-real-v01/server/"
          cp "build real/continental/data/continent-272.manifest.json" "$out/build real/continental/data/"
          cp "build real/integracao/relatorio-continental-272.json" "$out/build real/integracao/"
          cp game/build-real-v01/server/target/release/wh-server.exe "$out/"
          cp game/build-real-v01/tools/Iniciar-Wildhaven.bat "$out/"
          printf '%s\n' "Extraia TODOS os arquivos para uma pasta." "Clique duas vezes em Iniciar-Wildhaven.bat. Mantenha a janela do servidor aberta." "Abra http://127.0.0.1:8787 caso o navegador nao abra sozinho." "Modo leve: 7 hexagonos; E alterna modo economico. Progresso em memoria, sem banco." "Build de teste; sem garantia de FPS. Commit: $GITHUB_SHA" > "$out/LEIA-ME.txt"
      - name: Validar pacote no Windows sem Rust ou Node no PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path Wildhaven-Windows).Path
          $env:WH_REPO_ROOT = $root
          $env:WH_BIND = '127.0.0.1:18787'
          $env:WH_TIME_SCALE = '1'
          $env:WH_CACHE_MB = '128'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$root\wh-server.exe" -WorkingDirectory $root -PassThru -RedirectStandardOutput "$PWD\server-out.log" -RedirectStandardError "$PWD\server-err.log"
          try {
            $ready = $false
            for ($i=0; $i -lt 90; $i++) {
              if ($p.HasExited) { throw "Servidor saiu: $($p.ExitCode)" }
              try {
                $h=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/health' -TimeoutSec 2
                if ($h.Content.Trim() -eq 'ok') { $ready=$true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Servidor nao iniciou' }
            $page=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/' -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<html') { throw 'Cliente ausente' }
            $snap=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/snapshot' -TimeoutSec 15
            $null=$snap.Content | ConvertFrom-Json
            $glb=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/glb/terrain/HV_01' -TimeoutSec 30
            if ($glb.StatusCode -ne 200 -or $glb.RawContentLength -lt 1024) { throw 'GLB da vila ausente' }
            if ((Get-Content "$PWD\server-err.log" -Raw) -notmatch '7 tiles liberados') { throw 'Nao confirmou 7 terrenos' }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Content "$PWD\server-out.log","$PWD\server-err.log" -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-Windows-portatil-v01
          path: Wildhaven-Windows/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
