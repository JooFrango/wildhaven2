name: Wildhaven Windows portable V02
# Gera Wildhaven-Windows-portatil-v02.zip (modo leve: HV_01 + 6 vizinhos) e valida a inicialização no Windows
# sem Rust, Node, Git ou Visual Studio no PATH. Publica como artefato e como pré-lançamento (link direto).
on:
  push:
    branches: [claude/hopeful-noether-oehmyn]
    paths:
      - '.github/workflows/wildhaven-windows-portable-v02.yml'
      - 'game/build-real-v02/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-portable-v02
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout leve com histórico dos terrenos
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git clone --filter=blob:none --sparse --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          git checkout --detach "$GITHUB_SHA"
          git sparse-checkout set "build real/continental" "build real/integracao" game/build-real-v02 \
            labs/hunters/assets/hunter-pve-v01 world/hunters-village-v01/models \
            assets/models/creatures/folhisco assets/models/creatures/lobrapedra assets/models/creatures/dodarro \
            assets/models/creatures/silvarano assets/models/creatures/cavoru assets/models/creatures/torvalho \
            assets/models/creatures/tufrilo assets/models/creatures/nharuk assets/models/creatures/boscaranha creatures/species
          git cat-file -e '0a7aab5cfaa8446f6ddcbd5fb567516ad83d7d7c^{commit}' || git fetch origin 0a7aab5cfaa8446f6ddcbd5fb567516ad83d7d7c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Terrenos reais, física WHP1 e chunks visuais (7 hexes)
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          node "build real/continental/tools/fetch-sources.mjs" --out .generated/sources --around HV_01
          node "build real/continental/compiler/cli.mjs" --all --around HV_01 --old-root .generated/sources/old-root --new-root .generated/sources/new-root --out .generated/physics-272 --res 2 --chunk 256 --node-classes "build real/continental/compiler/node-classes-v01.json" --snap-centers lattice
          (cd game/build-real-v02/tools/visual && npm ci --no-audit --no-fund)
          node game/build-real-v02/tools/visual/build-visual.mjs --around HV_01 --chunk 256 --sources .generated/sources --out .generated/visual-v02
      - name: Compilar cliente
        shell: bash
        working-directory: src/game/build-real-v02/client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Compilar servidor Windows
        shell: pwsh
        working-directory: src/game/build-real-v02/server
        run: |
          rustup update stable
          rustup default stable
          cargo build --locked --release -p wh-server --bin wh-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Montar distribuição sem ferramentas de desenvolvimento
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          out=../Wildhaven-Windows-v02
          mkdir -p "$out/.generated" "$out/game/build-real-v02/client" "$out/game/build-real-v02/server" "$out/build real/continental/data" "$out/build real/integracao"
          cp -r .generated/physics-272 .generated/visual-v02 "$out/.generated/"
          mkdir -p "$out/assets/models" "$out/labs/hunters/assets" "$out/world/hunters-village-v01"
          cp -r assets/models/creatures "$out/assets/models/"
          cp -r labs/hunters/assets/hunter-pve-v01 "$out/labs/hunters/assets/"
          cp -r world/hunters-village-v01/models "$out/world/hunters-village-v01/"
          cp -r creatures "$out/"
          cp -r game/build-real-v02/client/dist "$out/game/build-real-v02/client/"
          cp -r game/build-real-v02/data game/build-real-v02/assets "$out/game/build-real-v02/"
          cp -r game/build-real-v02/server/migrations "$out/game/build-real-v02/server/"
          cp "build real/continental/data/continent-272.manifest.json" "$out/build real/continental/data/"
          cp "build real/integracao/relatorio-continental-272.json" "$out/build real/integracao/"
          cp game/build-real-v02/server/target/release/wh-server.exe "$out/"
          cp game/build-real-v02/tools/Iniciar-Wildhaven.bat "$out/"
          printf '%s\r\n' "Wildhaven - Build Real V02 (versao portatil de teste)" "" "1. Extraia TODOS os arquivos para uma pasta (nao rode de dentro do ZIP)." "2. Clique duas vezes em Iniciar-Wildhaven.bat e mantenha a janela do servidor aberta." "3. O navegador abre http://127.0.0.1:8787 (abra manualmente se nao abrir)." "" "Modo leve: Vila HV_01 + 6 hexes vizinhos com terreno detalhado; o resto do continente aparece como horizonte." "Teclas: M mapa, B bestiario, I inventario, F3 menu do desenvolvedor, Tab troca de Hunter." "Sistema > perfis Economico/Baixo/Medio/Alto. Progresso em memoria (sem banco)." "Build de teste: nenhum FPS foi medido em GPU real. Commit: $GITHUB_SHA" > "$out/LEIA-ME.txt"
          du -sh "$out"
      - name: Validar pacote no Windows sem Rust ou Node no PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path Wildhaven-Windows-v02).Path
          $env:WH_REPO_ROOT = $root
          $env:WH_BIND = '127.0.0.1:18787'
          $env:WH_TIME_SCALE = '1'
          $env:WH_CACHE_MB = '128'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$root\wh-server.exe" -WorkingDirectory $root -PassThru -RedirectStandardOutput "$PWD\server-out.log" -RedirectStandardError "$PWD\server-err.log"
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              if ($p.HasExited) { throw "Servidor saiu: $($p.ExitCode)" }
              try { $h=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/health' -TimeoutSec 2; if ($h.Content.Trim() -eq 'ok') { $ready=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Servidor nao iniciou' }
            $page=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/' -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Build Real V02') { throw 'Cliente V02 ausente' }
            $snap=(Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/snapshot' -TimeoutSec 15).Content | ConvertFrom-Json
            if ($snap.hunters.Count -lt 6) { throw 'Snapshot sem Hunters' }
            foreach ($u in @('/visual/HV_01/static.json','/visual/HV_01/static.glb','/visual/ER_18/veg.bin','/visual/prototypes.glb','/v02/horizon/horizonte-272-v01.glb','/v02/models/carroca/carroca_v02.glb','/glb/hunter.glb','/world/hunters-village-v01/models/phase_1.glb','/assets/models/creatures/folhisco/folhisco-optimized-v02-LOD0.glb')) {
              $r=Invoke-WebRequest -UseBasicParsing ("http://127.0.0.1:18787" + $u) -TimeoutSec 30
              if ($r.StatusCode -ne 200 -or $r.RawContentLength -lt 64) { throw "Arquivo ausente: $u" }
              Write-Host "ok $u $($r.RawContentLength) bytes"
            }
            if ((Get-Content "$PWD\server-err.log" -Raw) -notmatch '7 tiles liberados') { throw 'Nao confirmou 7 terrenos' }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Content "$PWD\server-out.log","$PWD\server-err.log" -ErrorAction SilentlyContinue
          }
      - name: Compactar ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path Wildhaven-Windows-v02\* -DestinationPath Wildhaven-Windows-portatil-v02.zip -CompressionLevel Optimal
          $f = Get-Item Wildhaven-Windows-portatil-v02.zip
          $sha = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$sha  Wildhaven-Windows-portatil-v02.zip" | Out-File -Encoding ascii Wildhaven-Windows-portatil-v02.zip.sha256
          Write-Host "ZIP $($f.Length) bytes sha256 $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-Windows-portatil-v02
          path: |
            Wildhaven-Windows-portatil-v02.zip
            Wildhaven-Windows-portatil-v02.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publicar pré-lançamento com link direto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=build-real-v02-portatil
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Wildhaven Build Real V02 — portátil Windows (pré-lançamento de teste)" \
            --notes "Gerado pelo workflow a partir do commit $GITHUB_SHA. Modo leve (HV_01 + 6 vizinhos). Validado no runner Windows: servidor inicia sem Rust/Node no PATH, cliente, snapshot e assets respondem. Não é versão aprovada; FPS em GPU real não medido." \
            Wildhaven-Windows-portatil-v02.zip Wildhaven-Windows-portatil-v02.zip.sha256
