name: Wildhaven Windows portable V04.2
# V04.2 — segunda varredura de otimização. Mesmo continente da V04:
#  - Wildhaven-Windows-portatil-v04.2.zip: jogo + vila HV_01 e 6 vizinhos + horizonte dos 272 hexes + 34 espécies;
#  - os demais hexes vêm da MESMA release build-real-v04-hexes (dados do terreno idênticos aos da V04; não
#    republicada aqui). Os pacotes são gerados neste runner só para validar o download sob demanda.
# Valida no Windows sem Rust/Node no PATH.
on:
  push:
    branches: [feat/build-real-v04-2-segunda-varredura]
    paths:
      - '.github/workflows/wildhaven-windows-portable-v04-2.yml'
      - 'game/build-real-v04-2/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildhaven-portable-v04-2
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout leve com histórico dos terrenos
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git clone --filter=blob:none --sparse --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          git checkout --detach "$GITHUB_SHA"
          git sparse-checkout set "build real/continental" "build real/integracao" "build real/loading-screen/v02" game/build-real-v04-2 game/build-real-v02/assets \
            labs/hunters/assets/hunter-pve-v01 world/hunters-village-v01/models creatures/species assets/models/creatures
          git cat-file -e '0a7aab5cfaa8446f6ddcbd5fb567516ad83d7d7c^{commit}' || git fetch origin 0a7aab5cfaa8446f6ddcbd5fb567516ad83d7d7c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Continente inteiro — fontes, física WHP1 (com regras de árvore costeiras medidas) e visual V04
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          node "build real/continental/tools/fetch-sources.mjs" --out .generated/sources
          node "build real/continental/compiler/cli.mjs" --all --old-root .generated/sources/old-root --new-root .generated/sources/new-root \
            --out .generated/physics-272-v04 --res 2 --chunk 256 --node-classes "build real/continental/compiler/node-classes-v01.json" \
            --snap-centers lattice --tree-rules game/build-real-v04-2/data/tree-rules-costeiros-v04.json
          (cd game/build-real-v04-2/tools/visual && npm ci --no-audit --no-fund)
          node game/build-real-v04-2/tools/visual/build-visual.mjs --chunk 256 --sources .generated/sources --out .generated/visual-base --config game/build-real-v04-2/data/vegetacao-provisoria-v02.json
          node game/build-real-v04-2/tools/visual/split-chunks.mjs --in .generated/visual-base --out .generated/visual-v04
          du -sh .generated/physics-272-v04 .generated/visual-v04
      - name: Compilar cliente
        shell: bash
        working-directory: src/game/build-real-v04-2/client
        run: npm ci --no-audit --no-fund && npm run build
      - name: Compilar servidor Windows
        shell: pwsh
        working-directory: src/game/build-real-v04-2/server
        run: |
          rustup update stable
          rustup default stable
          cargo build --locked --release -p wh-server --bin wh-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Montar o pacote base e os pacotes por hex
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          out=../Wildhaven-Windows-v04.2
          BASE="HV_01 ER_18 ER_21 ER_22 ER_24 ER_25 FX_20"
          mkdir -p "$out/.generated/physics-272-v04" "$out/.generated/visual-v04" "$out/game/build-real-v04-2/client" "$out/game/build-real-v04-2/server" "$out/game/build-real-v02" "$out/build real/continental/data" "$out/build real/loading-screen"
          for t in $BASE; do cp -r ".generated/physics-272-v04/$t-physics-v01" "$out/.generated/physics-272-v04/"; cp -r ".generated/visual-v04/$t" "$out/.generated/visual-v04/"; done
          cp .generated/physics-272-v04/compile-report.json "$out/.generated/physics-272-v04/"
          cp .generated/visual-v04/prototypes.* "$out/.generated/visual-v04/"
          cp -r "build real/loading-screen/v02" "$out/build real/loading-screen/"
          cp -r game/build-real-v02/assets "$out/game/build-real-v02/"
          # criaturas: só os LODs e retratos das 34 espécies integradas (lista gerada dos dados da V04)
          node -e 'const d=require("./game/build-real-v04-2/data/gameplay-provisorio-v04.json");const s=new Set();for(const e of Object.values(d.especies)){for(const l of (e.lods||[e.asset]))if(l)s.add(l.replace(/^\//,""));if(e.retrato)s.add(e.retrato);}console.log([...s].join("\n"))' > /tmp/criaturas.txt
          while IFS= read -r f; do mkdir -p "$out/$(dirname "$f")"; cp "$f" "$out/$f"; done < /tmp/criaturas.txt
          mkdir -p "$out/labs/hunters/assets" "$out/world/hunters-village-v01"
          cp -r labs/hunters/assets/hunter-pve-v01 "$out/labs/hunters/assets/"
          cp -r world/hunters-village-v01/models "$out/world/hunters-village-v01/"
          cp -r creatures "$out/"
          cp -r game/build-real-v04-2/client/dist "$out/game/build-real-v04-2/client/"
          cp -r game/build-real-v04-2/data "$out/game/build-real-v04-2/"
          cp -r game/build-real-v04-2/server/migrations "$out/game/build-real-v04-2/server/"
          cp "build real/continental/data/continent-272.manifest.json" "$out/build real/continental/data/"
          cp game/build-real-v04-2/server/target/release/wh-server.exe "$out/"
          cp game/build-real-v04-2/tools/Iniciar-Wildhaven.bat game/build-real-v04-2/tools/Baixar-Continente-Completo.bat "$out/"
          printf '%s\r\n' "Wildhaven - Build Real V04.2 (segunda varredura, versao portatil de teste)" "" "1. Extraia TODOS os arquivos para uma pasta (nao rode de dentro do ZIP)." "2. Clique duas vezes em Iniciar-Wildhaven.bat e mantenha a janela do servidor aberta." "3. O navegador abre http://127.0.0.1:8787." "" "O ZIP traz a Vila HV_01 e os 6 hexes vizinhos. Os demais 259 hexes certificados do continente sao baixados" "sob demanda (internet) quando um Hunter viaja para la, conferidos por SHA-256 e guardados em .generated." "Para jogar offline depois: Baixar-Continente-Completo.bat (~4,4 GB, uma vez)." "" "Teclas: M mapa (clique num hex para Viajar), B bestiario, I inventario, F3 desenvolvedor (exportar relatorio)." "Build de teste: nenhum FPS medido em GPU real. Commit: $GITHUB_SHA" > "$out/LEIA-ME.txt"
          du -sh "$out"
          python game/build-real-v04-2/tools/empacotar-hexes.py --physics .generated/physics-272-v04 --visual .generated/visual-v04 \
            --relatorio game/build-real-v04-2/data/relatorio-continental-272-v04.json --out ../hexes-v04 --excluir "$(echo $BASE | tr ' ' ',')"
          ls ../hexes-v04 | wc -l
      - name: Validar no Windows sem Rust ou Node no PATH (inclui download sob demanda de um hex)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path Wildhaven-Windows-v04.2).Path
          $hexes = (Resolve-Path hexes-v04).Path
          $py = Start-Process -FilePath python -ArgumentList '-m','http.server','18800','--bind','127.0.0.1' -WorkingDirectory $hexes -PassThru
          $env:WH_REPO_ROOT = $root
          $env:WH_BIND = '127.0.0.1:18787'
          $env:WH_TIME_SCALE = '1'
          $env:WH_CACHE_MB = '128'
          $env:WH_PACOTES_URL = 'http://127.0.0.1:18800/'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$root\wh-server.exe" -WorkingDirectory $root -PassThru -RedirectStandardOutput "$PWD\server-out.log" -RedirectStandardError "$PWD\server-err.log"
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              if ($p.HasExited) { throw "Servidor saiu: $($p.ExitCode)" }
              try { $h=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/health' -TimeoutSec 2; if ($h.Content.Trim() -eq 'ok') { $ready=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Servidor nao iniciou' }
            $page=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/' -TimeoutSec 10
            if ($page.Content -notmatch 'Build Real V04.2') { throw 'Cliente V04.2 ausente' }
            $n = 0
            for ($i=0; $i -lt 30; $i++) {
              try { $snap=(Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/snapshot' -TimeoutSec 15).Content | ConvertFrom-Json; $n = @($snap.hunters).Count } catch { $n = 0 }
              if ($n -ge 6) { break }
              Start-Sleep -Seconds 1
            }
            if ($n -lt 6) { throw "Snapshot sem Hunters ($n)" }
            foreach ($u in @('/api/v1/hexes','/visual/HV_01/chunks.json','/visual/prototypes.glb','/carregamento/index.html','/v02/horizon/horizonte-272-v01.glb','/glb/hunter.glb','/assets/models/creatures/arenoceto/v02/arenoceto-v02-skinned-animated-LOD0.glb')) {
              $r=Invoke-WebRequest -UseBasicParsing ("http://127.0.0.1:18787" + $u) -TimeoutSec 30
              if ($r.StatusCode -ne 200 -or $r.RawContentLength -lt 64) { throw "Arquivo ausente: $u" }
              Write-Host "ok $u $($r.RawContentLength) bytes"
            }
            # download sob demanda: viagem para um hex que NAO esta no pacote base
            $hid = ($snap.hunters | Where-Object { $_.role -eq 'hunter' } | Select-Object -First 1).id
            $body = @{ type='viajar'; hunters=@($hid); tile='ER_19' } | ConvertTo-Json
            $o = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18787/api/v1/orders' -Method Post -ContentType 'application/json' -Body $body
            Write-Host "ordem: $($o.Content)"
            $ok = $false
            for ($i=0; $i -lt 180; $i++) { if ((Get-Content "$PWD\server-err.log" -Raw) -match 'hex ER_19 baixado e conferido') { $ok = $true; break }; Start-Sleep -Seconds 1 }
            if (!$ok) { throw 'Download sob demanda do hex ER_19 nao concluiu' }
            if (!(Test-Path "$root\.generated\physics-272-v04\ER_19-physics-v01\index.json")) { throw 'Pacote ER_19 nao extraido' }
            Write-Host "download sob demanda ok"
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            if (!$py.HasExited) { Stop-Process -Id $py.Id -Force }
            Get-Content "$PWD\server-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
          # o pacote distribuido nao leva o hex baixado no teste
          Remove-Item -Recurse -Force "$root\.generated\physics-272-v04\ER_19-physics-v01","$root\.generated\visual-v04\ER_19" -ErrorAction SilentlyContinue
      - name: Compactar ZIP base
        shell: pwsh
        run: |
          Compress-Archive -Path Wildhaven-Windows-v04.2\* -DestinationPath Wildhaven-Windows-portatil-v04.2.zip -CompressionLevel Optimal
          $f = Get-Item Wildhaven-Windows-portatil-v04.2.zip
          $sha = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$sha  Wildhaven-Windows-portatil-v04.2.zip" | Out-File -Encoding ascii Wildhaven-Windows-portatil-v04.2.zip.sha256
          Write-Host "ZIP $($f.Length) bytes sha256 $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-Windows-portatil-v04.2
          path: |
            Wildhaven-Windows-portatil-v04.2.zip
            Wildhaven-Windows-portatil-v04.2.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publicar o ZIP base (os hexes continuam na release build-real-v04-hexes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete build-real-v04-2-portatil --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create build-real-v04-2-portatil --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Wildhaven Build Real V04.2 — portátil Windows (segunda varredura, pré-lançamento de teste)" \
            --notes "Gerado do commit $GITHUB_SHA. Base: vila + 6 vizinhos; demais hexes certificados sob demanda (release build-real-v04-hexes) ou via Baixar-Continente-Completo.bat. Validado no runner Windows sem Rust/Node, inclusive o download sob demanda de um hex. FPS em GPU real não medido no CI." \
            Wildhaven-Windows-portatil-v04.2.zip Wildhaven-Windows-portatil-v04.2.zip.sha256
